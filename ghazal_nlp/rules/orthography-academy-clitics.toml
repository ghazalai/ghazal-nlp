source.isbn = "978-622-5305-22-9"
source.page = 46
source.locator = "«یای نکره و مصدری و نسبت»، سطرهای «ها»ی غیرملفوظ و «ها»ی ملفوظ"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ای"]
detector.hosts = ["ه"]
detector.require_silent_he = true
detector.severity = "violation"
detector.confidence = "high"
examples.ok = [
  "خانه\u200cای", "گوشه\u200cای خزیدم", "گرهی در کار افتاد", "پندم مده ای دوست",
  "نکردی جگرگاه ای پور باز",
]
examples.violations = [
  { text = "مدرسه ای ساخت", expect = "مدرسه\u200cای" },
  { text = "گوشه ای", expect = "گوشه\u200cای" },
  { text = "پاره ای روغن", expect = "پاره\u200cای" },
]
notes = """
Was `proposed` and unexecutable until 22 September 2026. What changed is not the rule \
but the gate: the indefinite ای and the vocative ای share a glyph, page 34 puts the \
vocative always at a full space, and nothing in the characters separates «مدرسه ای ساخت» \
from «مده ای دوست». The host test does separate them, and the three ok examples above \
are the three failures it was built against, found by reading 106 real instances:

  پندم مده ای دوست        — مده is an imperative; its ه is not proven silent
  سر ببالین عدم بازنه ای  — likewise
  نکردی جگرگاه ای پور باز — the ه of گاه is pronounced, so the rule declines

All three now abstain rather than bond, and they abstain for two different recorded \
reasons (`he_not_proven_silent`, `he_is_voiced`) rather than one.\n\

The گ half of page 46's footnote — یای مصدری و نسبت deleting the ه and inserting گ \
(خانگی، همیشگی) — is still not executable and is still out. A pattern over \
«ه(\u200c)گی/گان» fires on سه\u200cگانه، ده\u200cگانه، دوازده\u200cگانه, which page 59 \
§۱-ب writes *with* a half-space, and on دهگان, which the same clause exempts. Measured \
over a 1.08M-word sample of a 2026 Persian corpus it produced 44 hits of which 25 were \
correct Persian — a 57% false-positive rate for six true findings, which is exactly the \
trade the rule base exists to refuse.
"""

[[rule]]
id = "orthography.ya_nakare_after_vowel_host"
layer = "orthography"
title.fa = "یای نکره پس\u200cاز «ی»"
title.en = "The indefinite ی after a ی host takes a linking ا and a ZWNJ"
statement.fa = """
یای نکره پس\u200cاز کلمهٔ مختوم به «ی» با صامت میانجی «ا» نوشته می\u200cشود: \
کشتی\u200cای، تیزپی\u200cای. ولی پس\u200cاز «و» و «ا» صامت میانجی «ی» است و کلمه پیوسته \
نوشته می\u200cشود: رادیویی، دانشجویی، دانایی.\
"""
statement.en = """
A ی host takes the linking ا and the half-space (کشتی\u200cای); a و or ا host takes a \
linking ی instead and stays solid (رادیویی، دانایی). The و row is the reason this rule \
names ی alone.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 46
source.locator = "«یای نکره و مصدری و نسبت»، سطرهای «ی» (پی، کشتی) در برابر «و» (رادیو) و «ا» (دانا)"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ای"]
detector.hosts = ["ی"]
detector.require_silent_he = false
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["کشتی\u200cای", "رادیویی خرید", "دانایی", "کشتی بزرگ"]
examples.violations = [
  { text = "کشتی ای دیدم", expect = "کشتی\u200cای" },
  { text = "صندلی ای", expect = "صندلی\u200cای" },
]
notes = """
Recorded and **not executed**, because it was measured and it failed.\n\

The vocative collision is here as it is after a silent ه, but there is no equivalent of \
the silent-ه inventory to close it: a ی host is decidable from the character, and that \
is exactly the problem — the character is all there is. Run over 2,094 spans on which \
two normalizers disagreed, this detector fired 22 times, and reading all 22 they are \
vocatives almost without exception: «علی ای …»، «جامی ای …»، «شکی ای …»، «ساحری ای …»، \
«گوی ای …». Ali's ruling on those spans names «شکی ای» among Hazm's errors, so the rule \
would have reproduced a defect already adjudicated against.\n\

The clause it transcribes is real and the ی row of page 46 is not in doubt. What is \
missing is a way to tell a منادا from an indefinite after a ی host, which is a \
clause-level question and not an orthographic one. It stays here, executable and off, so \
that the day something can answer that question the rule is a status change rather than \
a rediscovery.
"""
