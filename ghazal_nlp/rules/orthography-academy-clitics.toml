# Orthography — the enclitic sets, from the Academy standard's own tables.
#
#   دستور خطّ فارسی (ویراست جدید)
#   فرهنگستان زبان و ادب فارسی، نشر آثار، تهران، چاپ اول ۱۴۰۱
#   ISBN 978-622-5305-22-9
#   sha256 6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e
#
# Pages 42–46 are three tables with the same shape: a host, the class of its
# final letter, a linking consonant, and the resulting form. Between them they
# settle the whole enclitic system — the present copula, the possessive and
# objective pronouns (what recent grammars call ضمیر شخصی متصل, per the book's
# own footnote on p.44), and the indefinite/abstract ی.
#
# Read across all three tables the separator rule is one sentence: **the clitic
# takes a ZWNJ exactly when the host ends in ه، ی or و, and is written solid
# everywhere else.** After a connecting or a disconnecting consonant the tables
# write it solid (کتابم، برادرم) and there is nothing for a detector to find;
# after ا and after الف مقصوره a linking ی appears and the result is again
# solid (پایم، طوبایم). A full space is not among the forms any of the three
# tables gives.
#
# **The ZWNJ is not in the PDF.** Its text layer contains zero U+200C across all
# ninety pages, so every form here was read off the rendered page at 400dpi
# rather than extracted. Page 46 is the proof that the distinction is real and
# typographic: خانه‌ای and گرهی sit in adjacent rows of one table, the first
# with the half-space and the second without, because the ه of گره is
# pronounced and the ه of خانه is not.
#
# That is why these rules are gated on `require_silent_he` and not on the
# character. See `orthography.py` and `data/orthography-silent-he.tsv` for the
# inventory and for what it deliberately does not reach.
#
# ZWNJ (U+200C) is written \u200c throughout.

[[rule]]
id = "orthography.copula_after_silent_he"
layer = "orthography"
title.fa = "پیوستن «ام، ایم، اید، اند» به کلمهٔ مختوم به «ه»ی غیرملفوظ"
title.en = "The enclitic copula after a silent ه takes a ZWNJ, never a full space"
statement.fa = """
صورت\u200cهای متصل فعل «بودن» در زمان حال، پس\u200cاز کلمهٔ مختوم به «ه»ی غیرملفوظ، با \
صامت میانجی «ا» و بدون فاصلهٔ کامل نوشته می\u200cشوند: خسته\u200cام، خسته\u200cای، \
خسته\u200cایم، خسته\u200cاید، خسته\u200cاند. «است» از این قاعده بیرون است و با فاصلهٔ \
کامل نوشته می\u200cشود: خسته است.\
"""
statement.en = """
The present-tense enclitic forms of بودن attach to a host ending in silent ه through a \
linking ا and are written joined (خسته\u200cام، خسته\u200cاند). است is the one member of \
the set that stays a separate word (خسته است).
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "42–43"
source.locator = "«مجموعۀ ام، ای، است، ایم، اید، اند»، سطر «ها»ی غیرملفوظ"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ام", "ایم", "اید", "اند"]
detector.hosts = ["ه"]
detector.require_silent_he = true
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["شده\u200cاند", "رفته\u200cایم", "خسته است", "نامه رسید", "آگاه اند"]
examples.violations = [
  { text = "کرده اند", expect = "کرده\u200cاند" },
  { text = "رفته ام", expect = "رفته\u200cام" },
  { text = "گفته اید", expect = "گفته\u200cاید" },
]
notes = """
«ای» is deliberately not in this set, and the reason is on another page of the same \
book: page 34 makes ای (حرف ندا) a free word that always takes a full space. It is ruled \
separately by orthography.ya_nakare_after_silent_he, which can only fire once the host \
is proven — the copula set needs no such proof because اند، ایم، اید are never free \
words, while ای is.\n\

The solid error mode («خستهام») is not checked and that one is a lexicon problem: ابهام، \
الهام، اتهام all end in ـهام without containing a clitic, and separating a genuine host \
from them needs the word list we do not have.\n\

`آگاه اند` is in the ok examples because the gate has to be exercised by something the \
old pattern got wrong: the ه of آگاه is pronounced, so the joined form is آگاهند and not \
آگاه\u200cاند.
"""

[[rule]]
id = "orthography.copula_after_vowel_host"
layer = "orthography"
title.fa = "پیوستن «ام، ایم، اید، اند» به کلمهٔ مختوم به «ی» یا «و»"
title.en = "The enclitic copula after a ی or و host takes a ZWNJ"
statement.fa = """
صورت\u200cهای متصل فعل «بودن» در زمان حال، پس\u200cاز کلمهٔ مختوم به «ی» (مانند پی، \
کشتی، ایرانی) یا «و» (مانند تو)، با صامت میانجی «ا» و بدون فاصلهٔ کامل نوشته \
می\u200cشوند: تیزپی\u200cام، ایرانی\u200cایم، تیزپی\u200cاند.\
"""
statement.en = """
The same six-cell table gives the same treatment to a host ending in ی or و: a linking ا \
and no full space — تیزپی\u200cام، ایرانی\u200cاید، توام.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 43
source.locator = "«مجموعۀ ام، ای، است، ایم، اید، اند»، سطرهای «ی» و «و»"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ام", "ایم", "اید", "اند"]
detector.hosts = ["ی"]
detector.require_silent_he = false
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["ایرانی\u200cام", "تیزپی\u200cاند", "ایرانی است", "کشتی آمد"]
examples.violations = [
  { text = "ایرانی ام", expect = "ایرانی\u200cام" },
  { text = "راضی اند", expect = "راضی\u200cاند" },
]
notes = """
Split from the silent-ه rule rather than merged into it because the two environments \
need different gates, not because the standard separates them. A ی host is decidable \
from the character; a ه host is not.\n\

The و row of the table (توام، متروایید) is recorded here and not detected. و does not \
join to its left, so the joined and the unjoined spellings render identically and the \
corpus carries 18 space-written sites in total — below anything this rule could be \
measured on.
"""

[[rule]]
id = "orthography.clitic_pronoun_after_silent_he"
layer = "orthography"
title.fa = "پیوستن ضمایر ملکی و مفعولی به کلمهٔ مختوم به «ه»ی غیرملفوظ"
title.en = "A possessive/objective clitic after a silent ه takes a ZWNJ"
statement.fa = """
ضمایر ملکی و مفعولی (ـَم، ـَت، ـَش، ـِمان، ـِتان، ـِشان) پس\u200cاز کلمهٔ مختوم به «ه»ی \
غیرملفوظ چنین نوشته می\u200cشوند: خانه\u200cام، خانه\u200cات، خانه\u200cاش، \
خانه\u200cمان، خانه\u200cتان، خانه\u200cشان — ضمایر مفرد با صامت میانجی «ا» و ضمایر جمع \
بدون آن، و در هیچ حالت با فاصلهٔ کامل.\
"""
statement.en = """
The possessive/objective clitics attach to a host ending in silent ه with a linking ا in \
the singular (خانه\u200cات، خانه\u200cاش) and without one in the plural (خانه\u200cمان، \
خانه\u200cشان). None of the six is written as a separate word.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "44–45"
source.locator = "«ضمایر ملکی و مفعولی»، سطر «ه» با صدایی نظیر آنچه در «خانه» به کار رفته است"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ات", "اش", "مان", "تان", "شان"]
detector.hosts = ["ه"]
detector.require_silent_he = true
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["خانه\u200cاش", "همه\u200cشان", "کتاب او", "برادرش", "گاه اش"]
examples.violations = [
  { text = "خانه اش", expect = "خانه\u200cاش" },
  { text = "نتیجه اش", expect = "نتیجه\u200cاش" },
  { text = "همه شان", expect = "همه\u200cشان" },
]
notes = """
«ام» belongs to this set too and is not in it here: it is graphically identical to the \
copula ام, which page 42 owns, and a finding that cited the pronoun table for «رفته ام» \
would cite the wrong clause. The repair is the same either way; the citation is not, and \
the citation is the point.\n\

The plural clitics carry the half-space although they take no linking ا — the table \
prints خانه\u200cمان، خانه\u200cتان، خانه\u200cشان with the ه in final form. The old \
pattern here produced the right answer without being able to say why; the reason is that \
a silent ه at the end of a word is, in the standard's own words, «در حکم حرف منفصل» \
(p.27).\n\

«شان» is also an Arabic noun (شأن/شان), so a host ending in ه followed by it could in \
principle be two words; no instance appeared in the sample.
"""

