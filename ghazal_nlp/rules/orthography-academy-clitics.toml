[[rule]]
id = "orthography.ya_nakare_after_silent_he"
layer = "orthography"
title.fa = "یای نکره پس\u200cاز «ه»ی غیرملفوظ"
title.en = "The indefinite ی after a silent ه takes a linking ا and a ZWNJ"
statement.fa = """
یای نکره پس\u200cاز کلمهٔ مختوم به «ه»ی غیرملفوظ با صامت میانجی «ا» نوشته می\u200cشود: \
خانه\u200cای، مدرسه\u200cای، گوشه\u200cای. پس\u200cاز «ه»ی ملفوظ چنین نیست و «ی» \
بی\u200cواسطه می\u200cچسبد: گرهی.\
"""
statement.en = """
The indefinite ی joins a silent-ه host through a linking ا — خانه\u200cای — and a \
pronounced ه takes the ی directly and solid, گرهی. The two sit in adjacent rows of one \
table, which is what makes the distinction a fact of the standard rather than an \
inference from it.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
