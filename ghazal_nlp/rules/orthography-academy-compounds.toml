severity = "advisory"
notes = """
The second contested rule in the base, and unlike the first it was filed as contested \
*because of a measurement*. It started as an ordinary prescriptive rule and was the \
loudest thing in the pack: 24.5 findings per 10,000 words, touching 20.9% of Wikipedia \
segments — more than any other rule including the plural ها. That is the over-firing \
signature, so it was investigated rather than shipped.\n\

The investigation found the rule is not wrong. Page 69 prints these seventeen forms \
joined and the book writes «کلمهٔ پس\u200cاز خود» that way on nearly every page of its \
own text. What the volume measures is a real and near-total disagreement between the \
Academy and everyone who publishes Persian — recorded in `disputes` above with the \
counts.\n\

So the finding says the sources disagree and shows both, which is what a contested rule \
is for and what a 20.9% hit rate on ordinary prose actually means here. Severity \
advisory, confidence medium, and no auto-application. Adjudicating it does not belong in \
this record.
"""

[[rule.disputes]]
source = "contemporary editorial practice, measured over a 2026 Persian corpus"
summary = """
Published Persian writes these prepositions with a full space, and not marginally: in a \
1.08M-word sample, پیش از runs 340 spaced to 1 joined, بعد از 682 to 8, راجع به 180 to \
1, از نظر 150 to 6. Only به طور follows the Academy (164 joined to 47 spaced). A \
prescription this comprehensively ignored is a disagreement between the standard and the \
language's editors, not a population of typing errors.
"""

[[rule]]
id = "orthography.numeral_spacing"
layer = "orthography"
title.fa = "قواعد عددنویسی"
title.en = "How the parts of a written-out number are spaced"
statement.fa = """
اعداد بدون واو با نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشوند (یکصد، چهارصد، دوهزار، \
یک\u200cمیلیون؛ استثنا: نهصد)؛ اعداد واودار با فاصلهٔ کامل (بیست و یک، هزار و دویست و \
شصت و سه)؛ اعداد ترتیبی با فاصلهٔ کامل (بیست و سوم، سی و یکمین)؛ اعداد کسری با \
نیم\u200cفاصله/بی\u200cفاصله (یک\u200cچهارم، دوپنجم)؛ و واژه\u200cهای مرکبی که در \
آن\u200cها عدد به کار رفته با نیم\u200cفاصله/بی\u200cفاصله (۴۷سالگی، پنج\u200cلایه، \
ده\u200cچرخ)، مگر آن\u200cها که بسیط\u200cگونه شده\u200cاند (پنجشنبه، یکتا، یکدیگر، \
یکشنبه، یکهو).\
"""
statement.en = """
Five separate spacing rules for numbers written as words: no-vāv numbers join, \
vāv-bearing numbers and ordinals take full spaces, fractions join, and numeral compounds \
join except for a listed set that has lexicalised.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
