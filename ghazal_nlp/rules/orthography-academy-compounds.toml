notes = """
Recorded without a detector on purpose. Three of the five sub-rules are tractable in \
isolation and dangerous together: «دو هزار» is دوهزار when it is the number 2000 and two \
words when it is «دو هزار تومانی», and deciding which needs a reading of the noun phrase \
that this layer does not have. The examples are the specification the detector will be \
written against once the morphology layer can identify a numeral phrase.\n\

Worth recording separately: the standard says nothing at all about **digit characters**. \
Table 1 (pp. 29–32) lists the 33 letters and Table 2 (p. 33) the 10 secondary signs; \
neither contains a digit, and the Persian ۰۱۲۳ vs Arabic ٠١٢٣ question is not addressed \
anywhere in the 86 pages. Any rule we write about digit characters will have to cite \
something else.
"""
