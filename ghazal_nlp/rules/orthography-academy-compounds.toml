# Orthography — the fixed compounds the Academy standard settles by name.
#
#   دستور خطّ فارسی (ویراست جدید)
#   فرهنگستان زبان و ادب فارسی، نشر آثار، تهران، چاپ اول ۱۴۰۱
#   ISBN 978-622-5305-22-9
#   sha256 6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e
#
# Pages 34–36 and 69–71 of the standard are lists: *this word is written solid
# with the word after it, that one with a half-space, and here are the six
# exceptions.* Every rule in this pack is therefore a `closed_list` detector whose
# entries are transcribed from the printed list and nothing else. Where the
# standard prints an open-ended rule with two examples (که), the detector holds
# the two examples and abstains on everything else — see the notes on each rule.
#
# ZWNJ (U+200C) is written \u200c throughout.
#
# Which separator each entry takes is not a choice: page 23 defines نیم‌فاصله
# for a first part whose last letter connects (هیچ‌کس، این‌طور) and بی‌فاصله —
# literally nothing — for one that cannot (هرکس، آنجا، ازنظر). Both appear here
# and the difference is the standard's, not ours.

[[rule]]
id = "orthography.demonstrative_compounds"
layer = "orthography"
title.fa = "فاصله\u200cگذاری «این» و «آن» در ترکیب"
title.en = "The demonstratives این and آن in fixed compounds"
statement.fa = """
«این» و «آن» با فاصلهٔ کامل از کلمهٔ پس\u200cاز خود نوشته می\u200cشوند؛ ولی در حروف ربط \
مرکب میان آن\u200cها و کلمهٔ پس\u200cاز آن\u200cها نیم\u200cفاصله گذاشته می\u200cشود \
(آن\u200cطور، این\u200cطور، آن\u200cگونه، این\u200cگونه). استثنا: آنجا، آنچه، آنکه، \
اینجا، اینکه، وانگهی که پیوسته نوشته می\u200cشوند.\
"""
statement.en = """
این and آن take a full space before an ordinary noun (این کتاب), a ZWNJ in the compound \
conjunctions (این\u200cطور، آن\u200cگونه), and no separator at all in the six listed \
exceptions (آنجا، آنچه، آنکه، اینجا، اینکه، وانگهی).
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 34
source.locator = "بند «این، آن» و تبصره\u200cهای ۱ و ۲"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "closed_list"
detector.kind = "space_where_joined"
detector.entries."این طور" = "این\u200cطور"
detector.entries."آن طور" = "آن\u200cطور"
detector.entries."این گونه" = "این\u200cگونه"
detector.entries."آن گونه" = "آن\u200cگونه"
detector.entries."این جا" = "اینجا"
detector.entries."آن جا" = "آنجا"
detector.entries."آن چه" = "آنچه"
detector.abstain_on = ["این که", "آن که"]
detector.abstain_reason = "repair depends on sense — p. 34, تبصرهٔ ۲"
examples.ok = ["آنجا", "این کتاب", "این\u200cگونه", "این چه کاری است"]
examples.violations = [
  { text = "این طور", expect = "این\u200cطور" },
  { text = "آن جا", expect = "آنجا" },
  { text = "آن چه", expect = "آنچه" },
]
notes = """
«این چه» is deliberately absent: only آنچه is in the standard's exception list, so «این \
چه کاری است» is correct Persian and must not be flagged. «این که» and «آن که» abstain \
instead of firing, because تبصرهٔ ۲ makes the repair depend on the reading — solid اینکه \
as a plain conjunction, but این\u200cکه with a ZWNJ in the sense «این کسی که». The \
detector cannot read a sense, so it says which clause it cannot apply and stops there.
"""

[[rule]]
id = "orthography.har_lexicalised"
layer = "orthography"
title.fa = "ترکیب\u200cهای واژگانی\u200cشدهٔ «هر»"
title.en = "The lexicalised compounds of هر are written solid"
statement.fa = """
«هر» همواره با فاصلهٔ کامل از کلمهٔ پس\u200cاز خود نوشته می\u200cشود، مگر در مواردی که \
با آن واژگانی شده باشد که در این صورت بی\u200cفاصله نوشته می\u200cشود: هرآینه، هرازگاهی، \
هرچند، هرطور، هرکدام، هرکس، هرکه، هرگاه، هرگونه، هریک.\
"""
statement.en = """
هر takes a full space before an ordinary noun (هر روز) and no separator in the ten \
compounds the standard lists as lexicalised. It is بی\u200cفاصله rather than \
نیم\u200cفاصله because ر does not join to the letter after it.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 35
source.locator = "بند «هر»"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "closed_list"
detector.kind = "space_where_joined"
detector.entries."هر آینه" = "هرآینه"
detector.entries."هر از گاهی" = "هرازگاهی"
detector.entries."هر طور" = "هرطور"
detector.entries."هر کدام" = "هرکدام"
detector.entries."هر کس" = "هرکس"
detector.entries."هر که" = "هرکه"
detector.entries."هر گاه" = "هرگاه"
detector.entries."هر گونه" = "هرگونه"
detector.entries."هر یک" = "هریک"
detector.abstain_on = ["هر چند"]
detector.abstain_reason = "هرچند «although» and هر چند «every few» are not distinguishable here"
examples.ok = ["هرکس", "هر روز", "هرگاه", "هر انسانی"]
examples.violations = [
  { text = "هر کس", expect = "هرکس" },
  { text = "هر یک", expect = "هریک" },
  { text = "هر گونه", expect = "هرگونه" },
]
notes = """
«هر چند» abstains rather than fires, and it is the one entry that has to. هرچند is the \
concessive *although*; هر چند is هر modifying a quantity — «هر چند سال یک بار». The \
standard lists هرچند among the lexicalised forms without addressing the second reading, \
so joining every occurrence would turn a correct sentence into a wrong one. Everything \
else in the list is unambiguous. Measured over a 1.08M-word sample of a 2026 Persian \
corpus: 488 spaced occurrences of these forms, of which 42 are the ambiguous «هر چند».
"""

