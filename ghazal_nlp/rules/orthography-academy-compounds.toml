"""

[[rule]]
id = "orthography.ke_compound"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ «که» در ترکیب"
title.en = "که takes a ZWNJ when it compounds with the word before it"
statement.fa = """
«که» در ترکیب با کلمهٔ پیش\u200cاز خود با نیم\u200cفاصله نوشته می\u200cشود: \
چنان\u200cکه، چون\u200cکه. استثنا: آنکه، اینکه، بلکه. تبصره: «که» در نقش تأکید («شما که \
غریبه نیستید») با فاصلهٔ کامل نوشته می\u200cشود.\
"""
statement.en = """
که is written with a ZWNJ when it forms a compound with the preceding word \
(چنان\u200cکه، چون\u200cکه); آنکه، اینکه and بلکه are written solid; and the emphatic که \
— «شما که غریبه نیستید» — keeps its full space.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 35
source.locator = "بند «که» و تبصرهٔ آن"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "closed_list"
detector.kind = "space_where_zwnj"
detector.entries."چنان که" = "چنان\u200cکه"
detector.entries."چون که" = "چون\u200cکه"
detector.entries."بل که" = "بلکه"
examples.ok = [
  "چنان\u200cکه", "شما که غریبه نیستید", "بلکه", "این که حرف تازه\u200cای نیست",
]
examples.violations = [
  { text = "چنان که", expect = "چنان\u200cکه" },
  { text = "چون که", expect = "چون\u200cکه" },
]
notes = """
The standard's clause is open — *که in composition with the word before it* — and prints \
two examples. The detector holds exactly those two, because the emphatic که in the same \
section takes a full space after any word at all, so a general rule over «X که» would \
flag ordinary Persian on every second line. Widening this list is a lexicon problem \
(which X compound with که), and the lexicon is فرهنگ املایی خطّ فارسی, which we do not \
have.
"""

[[rule]]
id = "orthography.compound_conjunction"
layer = "orthography"
title.fa = "فاصله\u200cگذاری حروف ربط مرکب"
title.en = "Compound conjunctions are written without a full space"
statement.fa = """
فاصلهٔ میان اجزای حروف ربط مرکب — چه آن\u200cها که با «که» ساخته شده\u200cاند و چه بی \
«که» — نیم\u200cفاصله/بی\u200cفاصله است: ازآنجاکه، بااینکه، درحالی\u200cکه، \
درصورتی\u200cکه، بنابراین، ازاین\u200cرو، وگرنه. استثنا: بلکه. اگر جزء پیش\u200cاز «که» \
مجموعهٔ باز باشد (به\u200cطوری که، به\u200cنحوی که) فاصلهٔ کامل گذاشته می\u200cشود، و \
حروف ربط بیش از سه جزء نیز با فاصلهٔ کامل نوشته می\u200cشوند.\
"""
statement.en = """
The parts of a compound conjunction are held together by a ZWNJ, or by nothing where the \
preceding letter does not join. The standard prints both lists — the ones built with که \
and the ones without — and exempts open sets (به\u200cطوری که) and conjunctions of more \
than three parts (به هر دلیل که).
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "70–71"
source.locator = "«فاصله\u200cگذاری در حروف اضافهٔ مرکب و حروف ربط مرکب»، بند ۲، الف و ب"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "closed_list"
detector.kind = "space_where_joined"
detector.entries."آنجا که" = "آنجاکه"
detector.entries."آن گاه که" = "آن\u200cگاه\u200cکه"
detector.entries."از آنجا که" = "ازآنجاکه"
detector.entries."از آن جا که" = "ازآنجاکه"
detector.entries."از آن که" = "ازآنکه"
detector.entries."از این که" = "ازاینکه"
detector.entries."با آن که" = "باآنکه"
