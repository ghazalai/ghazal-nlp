detector.entries."بی آن که" = "بی\u200cآنکه"
detector.entries."در حالی که" = "درحالی\u200cکه"
detector.entries."در صورتی که" = "درصورتی\u200cکه"
detector.entries."زیرا که" = "زیراکه"
detector.entries."از این رو" = "ازاین\u200cرو"
detector.entries."از این گذشته" = "ازاین\u200cگذشته"
detector.entries."از سوی دیگر" = "ازسوی\u200cدیگر"
detector.entries."با این همه" = "بااین\u200cهمه"
detector.entries."با وجود این" = "باوجوداین"
detector.entries."بنا بر این" = "بنابراین"
detector.entries."به این ترتیب" = "به\u200cاین\u200cترتیب"
detector.entries."به این علت" = "به\u200cاین\u200cعلت"
detector.entries."و گرنه" = "وگرنه"
examples.ok = ["ازآنجاکه", "درحالی\u200cکه", "بلکه", "به\u200cطوری که", "به هر دلیل که"]
examples.violations = [
  { text = "در حالی که", expect = "درحالی\u200cکه" },
  { text = "با این که", expect = "بااینکه" },
  { text = "بنا بر این", expect = "بنابراین" },
]
notes = """
Each entry is the standard's own printed form; where a ZWNJ falls is decided by the \
joining behaviour of the preceding letter (page 23), not by taste — ازآنجاکه has no \
separator at all because ا and ز do not join forward, while درحالی\u200cکه needs one \
because ی does. «به\u200cطوری که» and «به هر دلیل که» stay unflagged because the \
standard exempts them explicitly, and the detector simply does not carry them. Measured \
over a 1.08M-word sample of a 2026 Persian corpus these forms appear spaced 293 times \
against roughly 100 joined — usage is genuinely split here, unlike the compound \
prepositions.
"""

[[rule]]
id = "orthography.compound_preposition"
layer = "orthography"
title.fa = "فاصله\u200cگذاری حروف اضافهٔ مرکب"
title.en = "Compound prepositions are written without a full space"
statement.fa = """
حرف اضافهٔ سادهٔ (پیشین یا پسین) و ستاک اسمی با نیم\u200cفاصله/بی\u200cفاصله (بسته به \
نوع حروف) نوشته می\u200cشوند: ازجهتِ، ازطریقِ، ازلحاظ، ازنظرِ، براساس، برحسبِ، برخلافِ، \
به\u200cسببِ، به\u200cطورِ، بعداز، به\u200cعلاوهٔ، به\u200cوسیلهٔ، پیش\u200cاز، درضمن، \
راجع\u200cبه، علاوه\u200cبر، مبنی\u200cبر. تبصرهٔ ۲: میان اجزای حروف اضافهٔ سه\u200cجزئی \
فاصلهٔ کامل گذاشته می\u200cشود.\
"""
statement.en = """
A simple preposition plus a nominal stem is held together by a ZWNJ, or by nothing where \
the preceding letter does not join. The standard prints the list; three-part \
prepositions (از برای خاطر، با توجّه به) keep full spaces.
"""
kind = "contested"
status = "contested"
scope.registers = ["formal_written", "technical"]
