عبارت\u200cهای عربی\u200cای که تبدیل به اصطلاح شده\u200cاند با \
نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشوند: ان\u200cشاءالله، ماشاءالله، \
الله\u200cاعلم، حقّ\u200cتعالی، باری\u200cتعالی، علی\u200cایّ\u200cحال، مع\u200cذلک، \
مع\u200cهذا، من\u200cبعد، صعب\u200cالحصول، دارالسّلام، حجرالاسود.\
"""
statement.en = """
An Arabic phrase that has entered Persian as a single term is written as a single term. \
This is the opposite of the Arabic-passage question: these are Persian words that happen \
to be Arabic in origin, not Arabic being quoted.
"""
