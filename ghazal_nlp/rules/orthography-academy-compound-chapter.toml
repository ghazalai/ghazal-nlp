compound with نامه, which is فرهنگ املایی خطّ فارسی, and we do not hold it. Footnote 4 \
on p. 60 says the same thing about «-سرا»، «-کار»، «-کش»، «-گرا»، «-گونه».
"""

[[rule]]
id = "orthography.compound_lexicalised_solid"
layer = "orthography"
title.fa = "ترکیب\u200cهای بسیط\u200cگونه"
title.en = "The compounds that have lexicalised are written solid"
statement.fa = """
ترکیب\u200cهای واژگانی\u200cشده (بسیط\u200cگونه) پیوسته نوشته می\u200cشوند: آبرو، آبشار، \
الفبا، تختخواب، رختخواب. همچنین کلمه\u200cهایی که در آن\u200cها کاهش یا افزایش واجی یا \
ادغام یا جابه\u200cجایی روی داده باشد: سکنجبین، سیصد، کمابیش، نستعلیق، هشیار. و \
ترکیب\u200cهای ساخته\u200cشده با «بِه» هنگامی که جزء دوم با «الف» یا «آ» آغاز نشود: \
بهبود، بهداشت، بهروز، بهزیستی، بهساز.\
"""
statement.en = """
Three clauses of part الف that are each a printed list: compounds that have become \
simple words, compounds carrying a phonological change, and the compounds of بِه whose \
second part does not start with a long ā.
"""
