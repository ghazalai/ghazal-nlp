  { text = "کتاب خانه", expect = "کتابخانه" },
  { text = "قطع\u200cنامه", expect = "قطعنامه" },
  { text = "فصل نامه", expect = "فصلنامه" },
]
notes = """
غسّالخانه is in the printed list and is not here: the spaced form «غسّال خانه» carries a \
shadda that the corpus writes four different ways, and an entry that can only match one \
of them is a list with a hidden hole. The general half-space case (آیین\u200cنامه، \
