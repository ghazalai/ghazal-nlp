detector.entries."تخت\u200cخواب" = "تختخواب"
detector.entries."رخت\u200cخواب" = "رختخواب"
detector.entries."آب\u200cشار" = "آبشار"
examples.ok = ["تختخواب", "آبشار", "بهداشت", "به خانه رفت", "به نام خدا"]
examples.violations = [
  { text = "تخت خواب", expect = "تختخواب" },
  { text = "رخت\u200cخواب", expect = "رختخواب" },
  { text = "کما بیش", expect = "کمابیش" },
]
notes = """
**Not one of the بِه compounds is detected, and that is a measurement.** They were \
transcribed from p. 61 in the first draft of this rule — بهبود، بهداشت، بهروز، بهزیستی، \
بهساز، بهداری، بهدین، بهنام — and over 18,000 segments of a 2026 Persian corpus the \
entry «به نام» alone fired **554 times**, every one of them on «به نام خدا» and its kin: \
an ordinary prepositional phrase. «به دین» fired 22 times on «به دین اسلام», «به روز» 12 \
on «به روز بعد».\n\

The cause is that بِه *good* and به *to* are the same two letters and the standard \
separates them by sense. A closed list cannot, so the first draft produced the \
highest-volume false positive in the whole rule base — louder than every real rule in \
this pack put together. The compounds stay in the Persian statement above, where a \
reader gets them, and out of the detector, where they would corrupt text.\n\

What is left detects only the compounds with no homograph: آبرو، آبشار، تختخواب، \
رختخواب، کمابیش. Page 61's تبصره points the same way from the other side — the بِه \
compounds whose second part begins with آ take a half-space (به\u200cآذین، \
به\u200cآفرید، به\u200cآیین) and footnote 3 adds the fruit به in به\u200cلیمو — three \
more senses that one list would have to tell apart.
"""

