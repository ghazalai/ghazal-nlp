  { text = "ان شاء الله", expect = "ان\u200cشاءالله" },
  { text = "مع ذلک", expect = "مع\u200cذلک" },
  { text = "حق تعالی", expect = "حقّ\u200cتعالی" },
]
notes = """
Fifteen of roughly sixty. The rest of the printed list is vocalised Arabic — \
اعلی\u200cالله\u200cمقامه، حمّالةالحطب، رَحِمَهُ\u200cالله، ذوالجلال\u200cوالاکرام — and \
a closed list matches exactly, so an entry transcribed from a rendered page with one \
shadda in the wrong place is an entry that can never fire, or worse, one that fires on \
something else. Those are held back until the list can be checked against a second \
source. What is here are the forms that carry no vowel signs in their spaced spelling \
and are unambiguous.\n\

«من بعد» was in this list and is not any more, and the reason is worth keeping. It fired \
twice over 18,000 segments of a 2026 Persian corpus. The first was Saadi — «و من بعد \
پریشان نگویم» — where من\u200cبعد means *henceforth* and the repair is right. The second \
was «من بعد ذلک غفراناً لکاتبه», which is not Persian at all: it is Arabic, من is the \
Arabic preposition *from*, and joining it would corrupt a quotation.\n\

One for one. That is the Arabic-passage problem in a single entry: the rule is about \
Arabic phrases naturalised **into** Persian, and it cannot tell them from Arabic being \
quoted, because they are the same words. Nothing in this layer can, until a \
passage-level gate exists — and the same evidence says a character-level one would not \
do it, since every character here is equally at home in both languages.
"""

[[rule]]
id = "orthography.present_stem_compound"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ ترکیب با بن مضارع"
title.en = "A compound whose second part is a present verb stem takes a ZWNJ"
statement.fa = """
ترکیب\u200cهایی که جزء دوم آن\u200cها بن مضارع فعل باشد همواره با \
نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشوند: اندوه\u200cبار، ریاضی\u200cدان، \
زبان\u200cشناس، گیاه\u200cشناس، مشقّت\u200cبار، موسیقی\u200cدان. تبصره: درصورتی\u200cکه \
کلمهٔ ساخته\u200cشده با بن مضارع نهادینه یا واژگانی شده باشد یا جنبهٔ اداری و صنفی یافته \
باشد پیوسته نوشته می\u200cشود: آبخیز، آبدار، آشپز، استاندار، بازیکن، بخشدار، پاسدار، \
جانباز، حسابدار، راهدار، رگبار، سالگرد، فرماندار، مهتاب، ولگرد.\
"""
statement.en = """
The general form of the compound rule: any noun plus a present stem is one word. This is \
the clause that would decide زبان\u200cشناس and ریاضی\u200cدان without a list — and it \
is recorded without a detector.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 62
source.locator = "«ترکیب\u200cها»، ب بند ۲ و تبصرهٔ آن"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["زبان\u200cشناس", "آبخیز", "حسابدار", "این بار", "کرده گیر"]
examples.violations = [
  { text = "زبان شناس", expect = "زبان\u200cشناس" },
  { text = "گیاه شناس", expect = "گیاه\u200cشناس" },
  { text = "ریاضی دان", expect = "ریاضی\u200cدان" },
]
notes = """
Proposed, and the reason is a measurement rather than a missing lexicon. Applied over \
420,000 segments of a 2026 Persian corpus with the present stems the standard's own \
examples name — دان، بار، گیر، دار، شناس، ساز، کش، خوان — the clause produced far more \
wrong findings than right ones, and always for the same reason: a present stem *is* a \
word. «این بار» is a noun. «به گر» is the conditional. «کرده گیر» and «شده دان» are the \
idioms *suppose that* and *know that*, which is a bare present stem used as a finite \
imperative and is the single most frequent construction the rule would break.\n\

What separates زبان\u200cشناس from «کرده گیر» is that the first element is a noun and \
the second is not a finite verb. That is a parse, not a lookup, and this layer does not \
have one.\n\

«کرده گیر» was re-examined 22 Sep 2026 after Ali asked whether کرده here is the noun \
کُرده rather than the participle کَرده. It is the participle, and the corpus is \
emphatic: of its 31 instances, two carry the privative نا- («آنچه کردم با تو من، ناکرده \
گیر»), which attaches to a participle and not to a noun, and the word before it is a \
light-verb complement in nearly all the rest — طی، مسخر، منزل، گذر، گنه، سیه، قوی، گل، \
راست. Saadi pairs it in consecutive lines with «پرورده گیر». The word Ali had in mind is \
real but is گُرده with گ — Dehkhoda's «میان دو کتف که سنگینی کوله بر روی آن افتد» — and \
the corpus carries it as گرده گاه (8) and «بر گرده گرفت»; کُرده with a damma occurs 32 \
times and is کُردها, the Kurds. The check also turned up «گرده گیر» three times, where \
گرده is the *round loaf*: «قرص مه را گرده گیر». Both spellings are therefore the same \
construction, «X را Y گیر» — which is the point this clause rests on. Two of the eight \
stems survive under the silent-ه gate and they are in \
`orthography.compound_after_silent_he`; the rest wait.\n\

The تبصره's twenty-four institutionalised forms are recorded in the statement rather \
than as a `solid_exceptions` list, because a list of exceptions to a rule that does not \
run is a list nothing reads.
"""

[[rule]]
id = "orthography.reduplicated_compound"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ ترکیب\u200cهای تکراری"
title.en = "A reduplicated compound takes a ZWNJ"
statement.fa = """
ترکیب\u200cهایی که از تکرار یک واژه ساخته می\u200cشوند با نیم\u200cفاصله/بی\u200cفاصله \
نوشته می\u200cشوند: بدوبدو، پایین\u200cپایین\u200cها، تک\u200cتک، جفت\u200cجفت، \
خط\u200cخطی، فردفرد، کم\u200cکم، کورکورانه، لنگ\u200cلنگان، یکی\u200cیکی. اگر بین دو جزء \
مکرّر کسرهٔ اضافه بیاید با فاصلهٔ کامل نوشته می\u200cشوند: خیسِ خیس، داغِ داغ داغ.\
"""
statement.en = """
X X is written X\u200cX — except when a kasre of ezāfe sits between the two, where it \
stays two words.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 62
source.locator = "«ترکیب\u200cها»، ب بند ۴ و پانویس ۲"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["تک\u200cتک", "کم\u200cکم", "یکی\u200cیکی", "خیسِ خیس"]
examples.violations = [
  { text = "تک تک", expect = "تک\u200cتک" },
  { text = "کم کم", expect = "کم\u200cکم" },
  { text = "جفت جفت", expect = "جفت\u200cجفت" },
]
notes = """
A two-line regex, and it is proposed rather than active for one reason: the exception is \
invisible. «خیسِ خیس» and «خیس خیس» differ only by a kasre, and normalization commonly \
strips diacritics — so by the time the rule base sees the text, the case the standard \
exempts and the case it repairs are the same string. Writing this rule against \
normalized text would be a rule that is wrong exactly where the standard bothered to say \
so.\n\

It becomes executable on text that keeps its diacritics. That is the version to build.
"""

[[rule]]
id = "orthography.ezafe_compound_spacing"
layer = "orthography"
title.fa = "فاصله\u200cگذاری ترکیب\u200cهای اضافی"
title.en = "An ezāfe compound is spaced by whether its kasre is pronounced"
statement.fa = """
ترکیب\u200cهای اضافی (شامل موصوف و صفت، مضاف و مضاف\u200cالیه) هنگامی که کسره یا نشانهٔ \
اضافه تلفّظ شود با فاصلهٔ کامل نوشته می\u200cشوند: درِ باغ، دوستِ صمیمی، نامهٔ من. \
درصورتی\u200cکه کسرهٔ اضافه تخفیف یافته یا محذوف باشد با نیم\u200cفاصله/بی\u200cفاصله \
نوشته می\u200cشوند: آب\u200cلیمو، آب\u200cمیوه، تخت\u200cجمشید، تخم\u200cمرغ، \
حاصل\u200cضرب، دست\u200cکم، سیب\u200cزمینی، صاحب\u200cنظر، صرف\u200cنظر، صورت\u200cجلسه، \
هیئت\u200cمدیره.\
"""
statement.en = """
The clause that decides نخست وزیر against نخست\u200cوزیر, and it decides it by \
pronunciation: full space when the ezāfe is said, half-space when it has been dropped.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 67
source.locator = "«ترکیب\u200cها»، ج بند ۱ و تبصره\u200cهای ۱ و ۲"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["تخم\u200cمرغ", "سیب\u200cزمینی", "دوستِ صمیمی", "آبرو"]
examples.violations = [
  { text = "تخم مرغ", expect = "تخم\u200cمرغ" },
  { text = "سیب زمینی", expect = "سیب\u200cزمینی" },
  { text = "صرف نظر", expect = "صرف\u200cنظر" },
]
notes = """
This is the clause Ali's preference for نخست\u200cوزیر belongs under, and it is the \
reason the preference cannot be shipped as a rule off this book. The standard's test is \
whether the ezāfe kasre is *pronounced*, which Persian script does not write and this \
layer cannot hear. What the standard supplies is thirteen printed examples, not a \
criterion a detector can apply — and نخست وزیر is not among them, so p. 58's «تنها موارد \
الزامی» governs and it is unruled by design.\n\

A house preference for نخست\u200cوزیر is therefore legitimate and must ship as a house \
preference with its own record, not as this rule with a page number borrowed from it. \
The printed thirteen could ship as a closed list tomorrow; the general clause needs the \
ezāfe, which is the vocalization layer's problem and is tracked there.
"""

[[rule]]
id = "orthography.compound_verb_full_space"
layer = "orthography"
title.fa = "فاصلهٔ کامل در مصدرهای مرکّب"
title.en = "The light verb of a compound verb keeps its full space"
statement.fa = """
در مصدرهای مرکّب و مصدرهای گروهی، همکرد (به\u200cصورت مصدری یا صرف\u200cشده) با یک \
فاصلهٔ کامل از جزء غیرهمکرد نوشته می\u200cشود: اختصاص دادن، اختصاص داده بودیم، به دست \
آوردن، جابه\u200cجا کردن، سخن گفتن، سخن گفتم. تبصرهٔ ۱: صورت\u200cهای مشتق از \
فعل\u200cهای گروهی و مصدرهای مرکّب با نیم\u200cفاصله نوشته می\u200cشوند: آشتی\u200cکنان، \
بازسازی\u200cشده، برون\u200cسپاری، به\u200cکارگیری، تصمیم\u200cگیرنده، فیلم\u200cبرداری، \
یاری\u200cدهنده. تبصرهٔ ۲: صورت\u200cهای اسمی مشتق از فعل\u200cهای مرکّب پیوسته نوشته \
می\u200cشوند: برونداد، پسماند، پیشرفت، رویداد، عملکرد، گرامیداشت.\
"""
statement.en = """
A compound verb is spaced; the noun and adjective derived from it are not. «نقل شده» as \
a verb keeps its space, «نقل\u200cشده» as a participle-adjective takes a half-space, and \
the difference is the syntax.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "67–68"
source.locator = "«ترکیب\u200cها»، ج بند ۲ و تبصره\u200cهای ۱ و ۲"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["سخن گفتن", "اختصاص دادن", "بازسازی\u200cشده", "پیشرفت", "نقل شده است"]
examples.violations = [
  { text = "سخن\u200cگفتن", expect = "سخن گفتن" },
  { text = "اختصاص\u200cدادن", expect = "اختصاص دادن" },
  { text = "بازسازی شده است", expect = "بازسازی\u200cشده" },
]
notes = """
Recorded because it answers an existing ruling and cannot yet be executed. Ali's note on \
a normalizer disagreement says «this نقل\u200cشده is correct with a space», and this \
clause is why he is right: در «نقل شده است» the شده is the light verb of a compound verb \
and takes a full space, while the same two words as an attributive adjective take a \
half-space. The detector needs to tell a verb chain from a noun phrase.\n\

The morphology layer is what would tell them apart, and its ceiling is already measured \
and already binding: the verb-stem lexicon held 113 verbs, and 17 of 24 sampled flush می \
left unrepaired stood before a verb the analyzer did not know. The same lexicon blocks \
this rule. Expanding it buys both at once, which makes it the highest-value item \
outstanding in this layer.
"""

[[rule]]
id = "orthography.proper_noun_compound"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ ترکیب دارای اسم خاص"
title.en = "A compound containing a proper noun takes a ZWNJ"
statement.fa = """
اگر یک جزء ترکیب اسم خاص باشد با نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشود: \
تهران\u200cگردی، حافظ\u200cپژوهی، سعدی\u200cصفت، عیسی\u200cدم.\
"""
statement.en = """
A compound with a name in it is held together, whatever the other part is.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 66
source.locator = "«ترکیب\u200cها»، بند ۱۲"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["حافظ\u200cپژوهی", "تهران\u200cگردی", "سعدی\u200cصفت", "سعدی گفت"]
examples.violations = [
  { text = "حافظ پژوهی", expect = "حافظ\u200cپژوهی" },
  { text = "تهران گردی", expect = "تهران\u200cگردی" },
  { text = "سعدی صفت", expect = "سعدی\u200cصفت" },
]
notes = """
Needs a name recognizer, which the fingerprint and corpus layers have the makings of and \
this layer does not. Recorded now because the examples are the specification: \
«سعدی\u200cصفت» joins and «سعدی گفت» does not, and any detector built here has to keep \
those apart before it ships.
"""

[[rule]]
id = "orthography.compound_adjective"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ صفت\u200cهای مرکّب"
title.en = "Compound adjectives take a ZWNJ"
statement.fa = """
صفت\u200cهای مرکّب با نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشوند: اجل\u200cرسیده، \
اخلال\u200cکننده، پاک\u200cدامن، پرفروش، تمام\u200cوقت، حق\u200cشناس، حقیقت\u200cجو، \
خوش\u200cبرخورد، درس\u200cخوان، زمین\u200cخوار، سیه\u200cچشم، شاه\u200cنشین، \
عافیت\u200cطلب، مصلحت\u200cبین، نیک\u200cبخت، یاری\u200cدهنده. تبصره: برخی صورت\u200cهای \
مرخّم صفت\u200cهای فاعلی و مفعولی به\u200cصورت پیوسته نهادینه شده\u200cاند: دانشجو، \
رهبر، کامران، نامزد.\
"""
statement.en = """
The broadest clause in the chapter, and the one furthest out of reach: any compound \
adjective is one word.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 66
source.locator = "«ترکیب\u200cها»، بند ۱۳ و تبصرهٔ آن"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["نیک\u200cبخت", "تمام\u200cوقت", "دانشجو", "رهبر", "مرد پاک"]
examples.violations = [
  { text = "نیک بخت", expect = "نیک\u200cبخت" },
  { text = "تمام وقت", expect = "تمام\u200cوقت" },
  { text = "پاک دامن", expect = "پاک\u200cدامن" },
]
notes = """
Requires knowing that a two-word sequence is an adjective, which is a part-of-speech \
decision over a phrase and not a property of either word. «پاک دامن» is the compound \
*chaste*; «دامن پاک» is a noun and its adjective and takes a full space. Recorded as the \
chapter's last clause so the pack is complete, and so that the next reader can see that \
the missing piece is a tagger rather than another list.
"""
