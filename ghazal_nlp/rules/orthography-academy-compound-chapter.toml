# Orthography — «ترکیب‌ها», the compounds chapter of the Academy standard.
#
#   دستور خطّ فارسی (ویراست جدید)
#   فرهنگستان زبان و ادب فارسی، نشر آثار، تهران، چاپ اول ۱۴۰۱
#   ISBN 978-622-5305-22-9
#   sha256 6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e
#   pages 58–68, read from the page rendered at 400dpi — the PDF's text layer
#   contains no U+200C anywhere, so an extraction cannot answer a spacing
#   question.
#
# Page 58 is the clause that governs everything here. The Academy names three
# possible policies for compound spacing — rule everything apart, rule
# everything together, or rule only the obligatory cases — and states that it
# chose the third: «تنها موارد الزامی جدانویسی یا پیوسته‌نویسی را ... معیّن
# کرده است». So a compound this chapter does not name is *deliberately
# unruled*, and نخست وزیر against نخست‌وزیر is not a violation either way. A
# preference there is a house preference and must ship labelled as one, not as
# a rule with a page number behind it.
#
# The chapter has three parts and they are not symmetrical:
#
#   الف) ترکیب‌هایی که الزاماً پیوسته نوشته می‌شوند     pp. 58–61
#   ب)  ترکیب‌هایی که الزاماً با نیم‌فاصله/بی‌فاصله     pp. 61–66
#   ج)  ترکیب‌هایی که الزاماً با فاصلهٔ کامل            pp. 67–68
#
# Two of its clauses are general rules with a gate we can actually test, and
# they are the ones worth having: p. 59 ج and p. 66 بند ۱۱ both say a compound
# whose first part ends in a **silent ه** takes a half-space, on the stated
# ground that «های غیرملفوظ در حکم حرف منفصل است». That is decidable, because
# the silent-ه inventory is derived from a corpus (see `orthography.py`).
#
# Everything else in the chapter is either a printed list — transcribed here
# verbatim as a closed list — or a rule whose gate we do not have, recorded
# with its examples and `status = "proposed"` so the specification exists
# before the detector does.
#
# Every active rule below was measured over 420,000 segments of a 2026 Persian
# corpus before it was made active, and every finding it produced was read.
# The measurements that *rejected* a clause are recorded in that rule's notes,
# because a rule the evidence killed is worth more than a rule that was never
# tried.
#
# ZWNJ (U+200C) is written \u200c throughout.

[[rule]]
id = "orthography.compound_after_silent_he"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ ترکیب پس از «ه»ی غیرملفوظ"
title.en = "A compound whose first part ends in a silent ه takes a ZWNJ"
statement.fa = """
کلمه\u200cهای مرکّبی که جزء اوّل آن\u200cها به «ها»ی غیرملفوظ ختم شود (های غیرملفوظ در \
حکم حرف منفصل است) با نیم\u200cفاصله نوشته می\u200cشود: بهانه\u200cگیر، پایه\u200cدار، \
کناره\u200cگیر. همچنین ترکیب\u200cهای پسوندی: دروازه\u200cبان، دیوانه\u200cوار، \
زباله\u200cدان، علاقه\u200cمند، لاله\u200cزار.\
"""
statement.en = """
Compounds built with a suffix are written solid — that is the default the standard sets \
on p. 58 — except when the first part ends in a silent ه, in which case the half-space \
is obligatory. The standard's own reason is that a silent ه counts as a non-joining \
letter.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "59, 66"
source.locator = "«ترکیب\u200cها»، الف بند ۱ ج؛ و بند ۱۱"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "compound"
detector.require_silent_he = true
detector.seconds = ["مند", "پژوه", "آمیز", "پرداز", "گری", "شناس", "بان"]
detector.host_exceptions = ["همه", "جمله", "همیشه", "هرگونه", "چگونه", "گونه", "درباره"]
examples.ok = ["علاقه\u200cمند", "دروازه\u200cبان", "خانه من", "همه کار", "گره دار"]
examples.violations = [
  { text = "علاقه مند", expect = "علاقه\u200cمند" },
  { text = "دروازه بان", expect = "دروازه\u200cبان" },
  { text = "عشوه گری", expect = "عشوه\u200cگری" },
]
notes = """
The gate is the rule. «خانهٔ من» is an ezāfe phrase that p. 67 ج.۱ gives a *full* space \
and «خانه\u200cدار» is a compound that takes a half-space, and nothing in the characters \
separates them — so the second element decides, and it is a closed set of bound elements \
the standard prints.\n\

Which second elements is a measured question, not a transcription. Run over 420,000 \
segments of a 2026 Persian corpus with the silent-ه gate and a wider set — گر، کار، گیر، \
دار، ساز، کش، دان، خوان، زار، نگار، خانه، نامه، آور — the rule produced 1,231 findings \
and most were wrong, all in the same way: the second element also exists as a free word. \
«دیده گر بیند» is the conditional گر; «همه کار» is a noun phrase; «کرده گیر» and «شده \
دان» are the idiomatic imperatives *suppose that* and *know that*; «نه جات» is جا with a \
clitic. The seven elements listed above are the ones with no free-word reading, and on \
them the rule produces 124 findings over 81 distinct forms of which every one was read \
and every one is a genuine violation — لاله\u200cزار، عشوه\u200cگری، شعبده\u200cپرداز، \
دیده\u200cبان، کعبه\u200cشناس، نهفته\u200cپژوه.\n\

زار is the instructive exclusion. It looks like the best candidate in the chapter — \
لاله\u200cزار and سبزه\u200cزار are the standard's own examples and they carry 53 of its \
94 findings — but زار is also the free adjective *wretched*, and «همه زار»، «ناله زار»، \
«چگونه زار»، «شده زار» are correct Persian. At roughly 2:1 it is too good to drop and \
not good enough to ship, so it is named here rather than silently omitted.\n\

دار and ساز are the same shape at about 7:3 (پرده\u200cدار، روزه\u200cدار، چاره\u200cساز \
right; «پاینده دار» and «کرده ساز» wrong) and are the obvious next work: a finite-verb \
reading would decide them, which is the morphology layer's job and not this one's.
"""

[[rule]]
id = "orthography.suffix_always_zwnj"
layer = "orthography"
title.fa = "پسوندهایی که همواره با نیم\u200cفاصله نوشته می\u200cشوند"
title.en = "The suffixes that take a ZWNJ whatever the host"
statement.fa = """
پسوندهای «-آسا»، «-آگین»، «-فام»، «-وش» همواره با نیم\u200cفاصله/بی\u200cفاصله (بسته به \
نوع حروف) از کلمهٔ پیش\u200cاز خود نوشته می\u200cشوند: برق\u200cآسا، خشم\u200cآگین، \
آتش\u200cفام، تلخ\u200cوش. پسوند «-وار» نیز همواره با نیم\u200cفاصله نوشته می\u200cشود، \
مگر در: بزرگوار، خانوار، راهوار/رهوار، سوگوار، شاهوار/شهوار، عیالوار، ماهوار.\
"""
statement.en = """
Unlike the suffixes of the previous rule, these four — and وار — take the half-space \
regardless of what the host ends in. وار carries the standard's own list of eight \
exceptions, which are written solid.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical", "verse", "classical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "59–60"
source.locator = "«ترکیب\u200cها»، الف بند ۱، تبصره\u200cهای ۱ و ۴"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "compound"
detector.require_silent_he = false
detector.seconds = ["وار", "آسا", "آگین", "فام", "وش"]
detector.host_exceptions = ["همه", "جمله", "همیشه", "هرگونه", "چگونه", "گونه"]
examples.ok = ["برق\u200cآسا", "بزرگوار", "سوگوار", "خشم\u200cآگین"]
examples.violations = [
  { text = "پروانه وار", expect = "پروانه\u200cوار" },
  { text = "نهنگ آسا", expect = "نهنگ\u200cآسا" },
  { text = "خشم آگین", expect = "خشم\u200cآگین" },
]
notes = """
The eight وار exceptions need no exception list here and deliberately have none: بزرگوار \
and سوگوار are written solid, so they arrive as a single token and the space scan never \
sees them. Listing them would be a transcription with no effect, which is worse than not \
listing them.\n\

Measured over 420,000 segments of a 2026 Persian corpus: 387 findings over 270 distinct \
forms — موسی\u200cوار، پروانه\u200cوار، سلیمان\u200cوار، خاقانی\u200cآسا، \
گوهر\u200cآگین، لعل\u200cفام، ماه\u200cوش. Read in full, the only residue is a handful \
of verse artefacts where فام follows a finite verb («شود فام»).\n\

باره and جات are in the standard's same تبصره and are **not** here. باره is a free noun \
— «دربارهٔ او»، «بر باره نشست» — and جات is far more often جا with a second-person \
clitic («نه جات»، «هر جات») than the plural suffix. Both would fire on ordinary Persian.
"""

[[rule]]
id = "orthography.suffix_san"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ پسوند «-سان»"
title.en = "The suffix سان takes a ZWNJ"
statement.fa = """
پسوند «-سان» همواره با نیم\u200cفاصله/بی\u200cفاصله از کلمهٔ پیش\u200cاز خود نوشته \
می\u200cشود، مگر در: همسان، یکسان.\
"""
statement.en = """
سان takes the half-space after any host; همسان and یکسان are the two forms the standard \
writes solid.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical", "verse", "classical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 59
source.locator = "«ترکیب\u200cها»، الف بند ۱، تبصرهٔ ۲"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["یکسان", "همسان", "سیماب\u200cسان"]
examples.violations = [
  { text = "نهنگ سان", expect = "نهنگ\u200cسان" },
  { text = "شمع سان", expect = "شمع\u200cسان" },
]
notes = """
Split from the rule above on evidence rather than on the page — the standard puts سان in \
the same تبصره as وار, and it was written here as an executable rule first. It is \
proposed because it was then measured, twice, and failed both times.\n\

Over 420,000 segments of a 2026 Persian corpus it produces 341 findings, more than every \
other suffix in this pack combined, and 89% of them are one construction the standard \
never illustrates: a demonstrative contraction plus سان — «بدین سان» 75, «زین سان» 46, \
«بران سان» 39, «زان سان» 33, «ازین سان» 26. The clause says «همواره», so بدین\u200cسان \
is probably what it intends, but probably is not what the other rules here stand on.\n\

The second measurement is the one that settles it. Run over a Wikipedia sample, seven of \
fourteen findings were not Persian at all: «نیویورک سان» is *The New York Sun*, \
«دوسالانهٔ سان» a biennale, and سان is separately an ordinary Persian noun in «سان دیدن» \
— a military review. A suffix rule firing on an English newspaper masthead is not a \
severity problem that advisory would contain; it is the wrong rule. It needs a gate that \
knows the host is Persian and the سان is a suffix, and that gate does not exist here.
"""

[[rule]]
id = "orthography.suffix_vareh_solid"
layer = "orthography"
title.fa = "پیوسته\u200cنویسی پسوند «-واره»"
title.en = "The suffix واره is written solid"
statement.fa = """
پسوند «-واره» همواره به\u200cصورت پیوسته با کلمهٔ پیش\u200cاز خود نوشته می\u200cشود: \
جشنواره، سنگواره، گاهواره، ماهواره.\
"""
statement.en = """
واره is the counterpart of وار and goes the other way: it is always solid. The pair is \
why the standard prints them in one تبصره.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 59
source.locator = "«ترکیب\u200cها»، الف بند ۱، تبصرهٔ ۱"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "closed_list"
detector.kind = "space_where_joined"
detector.entries."جشن واره" = "جشنواره"
detector.entries."سنگ واره" = "سنگواره"
detector.entries."گاه واره" = "گاهواره"
detector.entries."ماه واره" = "ماهواره"
detector.entries."جشن\u200cواره" = "جشنواره"
detector.entries."سنگ\u200cواره" = "سنگواره"
detector.entries."گاه\u200cواره" = "گاهواره"
detector.entries."ماه\u200cواره" = "ماهواره"
examples.ok = ["جشنواره", "ماهواره", "سنگواره"]
examples.violations = [
  { text = "جشن واره", expect = "جشنواره" },
  { text = "ماه\u200cواره", expect = "ماهواره" },
]
notes = """
Four printed words, and the half-spaced forms are listed alongside the spaced ones \
because واره is the one suffix in the chapter where a ZWNJ is the error rather than the \
repair — a writer who has learned «-وار» will write «ماه\u200cواره», and that is \
precisely the mistake this تبصره exists to prevent.
"""

[[rule]]
id = "orthography.pseudo_suffix_lexicalised"
layer = "orthography"
title.fa = "ترکیب\u200cهای واژگانی\u200cشدهٔ «-خانه» و «-نامه»"
title.en = "The lexicalised compounds of خانه and نامه are written solid"
statement.fa = """
پسوندواره\u200cهای «-خانه»، «-نامه» و نظایر آن\u200cها همواره با \
نیم\u200cفاصله/بی\u200cفاصله از کلمهٔ پیش\u200cاز خود نوشته می\u200cشوند، مگر در \
ترکیب\u200cهایی که واژگانی شده\u200cاند: سفارتخانه، غسّالخانه، کتابخانه، گلخانه، میخانه، \
اساسنامه، بخشنامه، دانشنامه، سالنامه، شاهنامه، فصلنامه، قطعنامه، قولنامه، ماهنامه.\
"""
statement.en = """
خانه and نامه are productive enough that the standard calls them pseudo-suffixes. They \
take a half-space by default; the fourteen compounds it prints have lexicalised and are \
written solid.
"""
kind = "prescriptive"
status = "active"
