# Orthography: the enclitics, from the tables on pp. 42–46.
#
#   دستور خطّ فارسی (ویراست جدید)
#   فرهنگستان زبان و ادب فارسی، نشر آثار، تهران، چاپ اول ۱۴۰۱
#   ISBN 978-622-5305-22-9
#   sha256 6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e
#
# A clitic takes a ZWNJ after ه، ی or و and is solid otherwise; a ه host counts only once its ه is known silent.
# ZWNJ (U+200C) is written \u200c.

[[rule]]
id = "academy.copula_after_silent_he"
layer = "orthography"
title.fa = "پیوستن «ام، ایم، اید، اند» به کلمهٔ مختوم به «ه»ی غیرملفوظ"
title.en = "The enclitic copula after a silent ه takes a ZWNJ, never a full space"
statement.fa = """
صورت\u200cهای متصل فعل «بودن» در زمان حال، پس\u200cاز کلمهٔ مختوم به «ه»ی غیرملفوظ، با \
صامت میانجی «ا» و بدون فاصلهٔ کامل نوشته می\u200cشوند: خسته\u200cام، خسته\u200cای، \
خسته\u200cایم، خسته\u200cاید، خسته\u200cاند. «است» از این قاعده بیرون است و با فاصلهٔ \
کامل نوشته می\u200cشود: خسته است.\
"""
statement.en = """
The present-tense enclitic forms of بودن attach to a host ending in silent ه through a \
linking ا and are written joined (خسته\u200cام، خسته\u200cاند). است is the one member of \
the set that stays a separate word (خسته است).
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "42–43"
source.locator = "«مجموعۀ ام، ای، است، ایم، اید، اند»، سطر «ها»ی غیرملفوظ"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ام", "ایم", "اید", "اند"]
detector.hosts = ["ه"]
detector.require_silent_he = true
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["شده\u200cاند", "رفته\u200cایم", "خسته است", "نامه رسید", "آگاه اند"]
examples.violations = [
  { text = "کرده اند", expect = "کرده\u200cاند" },
  { text = "رفته ام", expect = "رفته\u200cام" },
  { text = "گفته اید", expect = "گفته\u200cاید" },
]
notes = "ای isn't in the set: the vocative ای is a free word (p. 34), so it's handled by academy.ya_nakare_after_silent_he. The solid error (خستهام) isn't checked, since ابهام، الهام، اتهام end the same way."

[[rule]]
id = "academy.copula_after_vowel_host"
layer = "orthography"
title.fa = "پیوستن «ام، ایم، اید، اند» به کلمهٔ مختوم به «ی» یا «و»"
title.en = "The enclitic copula after a ی or و host takes a ZWNJ"
statement.fa = """
صورت\u200cهای متصل فعل «بودن» در زمان حال، پس\u200cاز کلمهٔ مختوم به «ی» (مانند پی، \
کشتی، ایرانی) یا «و» (مانند تو)، با صامت میانجی «ا» و بدون فاصلهٔ کامل نوشته \
می\u200cشوند: تیزپی\u200cام، ایرانی\u200cایم، تیزپی\u200cاند.\
"""
statement.en = """
The same six-cell table gives the same treatment to a host ending in ی or و: a linking ا \
and no full space — تیزپی\u200cام، ایرانی\u200cاید، توام.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 43
source.locator = "«مجموعۀ ام، ای، است، ایم، اید، اند»، سطرهای «ی» و «و»"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ام", "ایم", "اید", "اند"]
detector.hosts = ["ی"]
detector.require_silent_he = false
detector.not_before = ["القرا", "القرای", "اس", "جی", "پی", "دی", "بی", "وی", "آر", "تی"]
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["ایرانی\u200cام", "تیزپی\u200cاند", "ایرانی است", "کشتی آمد", "بیماری ام اس", "ادعای ام القرا"]
examples.violations = [
  { text = "ایرانی ام", expect = "ایرانی\u200cام" },
  { text = "راضی اند", expect = "راضی\u200cاند" },
]
notes = "The و row (توام) isn't checked: و doesn't join to the left, so the half-space can't be seen."

[[rule]]
id = "academy.clitic_pronoun_after_silent_he"
layer = "orthography"
title.fa = "پیوستن ضمایر ملکی و مفعولی به کلمهٔ مختوم به «ه»ی غیرملفوظ"
title.en = "A possessive/objective clitic after a silent ه takes a ZWNJ"
statement.fa = """
ضمایر ملکی و مفعولی (ـَم، ـَت، ـَش، ـِمان، ـِتان، ـِشان) پس\u200cاز کلمهٔ مختوم به «ه»ی \
غیرملفوظ چنین نوشته می\u200cشوند: خانه\u200cام، خانه\u200cات، خانه\u200cاش، \
خانه\u200cمان، خانه\u200cتان، خانه\u200cشان — ضمایر مفرد با صامت میانجی «ا» و ضمایر جمع \
بدون آن، و در هیچ حالت با فاصلهٔ کامل.\
"""
statement.en = """
The possessive/objective clitics attach to a host ending in silent ه with a linking ا in \
the singular (خانه\u200cات، خانه\u200cاش) and without one in the plural (خانه\u200cمان، \
خانه\u200cشان). None of the six is written as a separate word.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "44–45"
source.locator = "«ضمایر ملکی و مفعولی»، سطر «ه» با صدایی نظیر آنچه در «خانه» به کار رفته است"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ات", "اش", "مان", "تان", "شان"]
detector.hosts = ["ه"]
detector.require_silent_he = true
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["خانه\u200cاش", "همه\u200cشان", "کتاب او", "برادرش", "گاه اش"]
examples.violations = [
  { text = "خانه اش", expect = "خانه\u200cاش" },
  { text = "نتیجه اش", expect = "نتیجه\u200cاش" },
  { text = "همه شان", expect = "همه\u200cشان" },
]
notes = "ام is left to the copula rule: the two look the same and the copula table owns the citation. شان can also be the noun شأن, though that's rare here."

[[rule]]
id = "academy.clitic_pronoun_after_vowel_host"
layer = "orthography"
title.fa = "پیوستن ضمایر ملکی و مفعولی به کلمهٔ مختوم به «ی»"
title.en = "A possessive/objective clitic after a ی host takes a ZWNJ"
statement.fa = """
ضمایر ملکی و مفعولی پس\u200cاز کلمهٔ مختوم به «ی» (مانند پی، کشتی) با صامت میانجی «ا» در \
مفرد و بدون آن در جمع، و بدون فاصلهٔ کامل نوشته می\u200cشوند: کشتی\u200cام، \
کشتی\u200cات، کشتی\u200cاش، کشتی\u200cمان، کشتی\u200cتان، کشتی\u200cشان.\
"""
statement.en = """
The same table's ی rows: کشتی\u200cاش، پی\u200cات، کشتی\u200cشان — a linking ا in the \
singular, none in the plural, and never a full space.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 45
source.locator = "«ضمایر ملکی و مفعولی»، سطرهای «ی» (پی، کشتی) و «و» (رادیو)"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ات", "اش", "مان", "تان", "شان"]
detector.hosts = ["ی"]
detector.require_silent_he = false
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["کشتی\u200cاش", "زندگی\u200cمان", "کشتی بزرگ", "برادرش"]
examples.violations = [
  { text = "زندگی اش", expect = "زندگی\u200cاش" },
  { text = "کشتی شان", expect = "کشتی\u200cشان" },
]
notes = "The و row (رادیوام) isn't checked, as in academy.copula_after_vowel_host."

[[rule]]
id = "academy.ya_nakare_after_silent_he"
layer = "orthography"
title.fa = "یای نکره پس\u200cاز «ه»ی غیرملفوظ"
title.en = "The indefinite ی after a silent ه takes a linking ا and a ZWNJ"
statement.fa = """
یای نکره پس\u200cاز کلمهٔ مختوم به «ه»ی غیرملفوظ با صامت میانجی «ا» نوشته می\u200cشود: \
خانه\u200cای، مدرسه\u200cای، گوشه\u200cای. پس\u200cاز «ه»ی ملفوظ چنین نیست و «ی» \
بی\u200cواسطه می\u200cچسبد: گرهی.\
"""
statement.en = "The indefinite ی joins a silent-ه host through a linking ا (خانه\u200cای); a pronounced ه takes the ی directly and solid (گرهی)."
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 46
source.locator = "«یای نکره و مصدری و نسبت»، سطرهای «ها»ی غیرملفوظ و «ها»ی ملفوظ"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ای"]
detector.hosts = ["ه"]
detector.require_silent_he = true
detector.severity = "violation"
detector.confidence = "high"
examples.ok = [
  "خانه\u200cای", "گوشه\u200cای خزیدم", "گرهی در کار افتاد", "پندم مده ای دوست",
  "نکردی جگرگاه ای پور باز",
]
examples.violations = [
  { text = "مدرسه ای ساخت", expect = "مدرسه\u200cای" },
  { text = "گوشه ای", expect = "گوشه\u200cای" },
  { text = "پاره ای روغن", expect = "پاره\u200cای" },
]
notes = "Fires only when the host's ه is known to be silent, because the vocative ای looks the same: «مده ای دوست» abstains. The گ form (خانگی، همیشگی) isn't checked: a pattern would hit سه\u200cگانه and دهگان, which are right."

[[rule]]
id = "academy.ya_nakare_after_vowel_host"
layer = "orthography"
title.fa = "یای نکره پس\u200cاز «ی»"
title.en = "The indefinite ی after a ی host takes a linking ا and a ZWNJ"
statement.fa = """
یای نکره پس\u200cاز کلمهٔ مختوم به «ی» با صامت میانجی «ا» نوشته می\u200cشود: \
کشتی\u200cای، تیزپی\u200cای. ولی پس\u200cاز «و» و «ا» صامت میانجی «ی» است و کلمه پیوسته \
نوشته می\u200cشود: رادیویی، دانشجویی، دانایی.\
"""
statement.en = """
A ی host takes the linking ا and the half-space (کشتی\u200cای); a و or ا host takes a \
linking ی instead and stays solid (رادیویی، دانایی). The و row is the reason this rule \
names ی alone.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 46
source.locator = "«یای نکره و مصدری و نسبت»، سطرهای «ی» (پی، کشتی) در برابر «و» (رادیو) و «ا» (دانا)"
source.retrieved = "2026-09-22"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "enclitic"
detector.clitics = ["ای"]
detector.hosts = ["ی"]
detector.require_silent_he = false
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["کشتی\u200cای", "رادیویی خرید", "دانایی", "کشتی بزرگ"]
examples.violations = [
  { text = "کشتی ای دیدم", expect = "کشتی\u200cای" },
  { text = "صندلی ای", expect = "صندلی\u200cای" },
]
notes = "Off: after a ی host it mostly hits vocatives («علی ای …», «شکی ای …»), and nothing here tells a vocative from the indefinite."
