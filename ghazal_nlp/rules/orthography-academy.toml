[[rule.disputes]]
source = "contemporary editorial practice"
summary = """
A large share of modern Persian publishing, and most web text, writes خانه\u200cی. The \
form is legible, unambiguous, and survives copy-paste between systems that mangle U+0654 \
— a real argument the standard does not address.
