[[rule]]
id = "academy.interfix_compound"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ ترکیب\u200cهای بیناوندی"
title.en = "Compounds built on an interfix take a ZWNJ"
statement.fa = """
ترکیب\u200cهای ساخته\u200cشده با بیناوندهای «ا»، «به»، «تا»، و «وا» با \
نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشوند: جابه\u200cجا، دست\u200cبه\u200cدست، \
دم\u200cبه\u200cدم، دورادور، روبه\u200cرو، سربه\u200cسر، گوش\u200cتاگوش، \
لحظه\u200cبه\u200cلحظه، موبه\u200cمو. تبصره: آن دسته از ترکیب\u200cهای با بیناوند «ا» که \
امکان اتّصال بیناوند به حرف پیشین وجود دارد پیوسته نوشته می\u200cشوند: تنگاتنگ، دمادم، \
رنگارنگ، لبالب، مالامال.\
"""
statement.en = """
X-به-X and X-تا-X compounds are held together, not spaced. The ا interfix goes solid \
instead wherever the letter before it joins.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
