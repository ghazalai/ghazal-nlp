[[rule]]
id = "academy.pseudo_suffix_lexicalised"
layer = "orthography"
title.fa = "ترکیب\u200cهای واژگانی\u200cشدهٔ «-خانه» و «-نامه»"
title.en = "The lexicalised compounds of خانه and نامه are written solid"
statement.fa = """
پسوندواره\u200cهای «-خانه»، «-نامه» و نظایر آن\u200cها همواره با \
نیم\u200cفاصله/بی\u200cفاصله از کلمهٔ پیش\u200cاز خود نوشته می\u200cشوند، مگر در \
ترکیب\u200cهایی که واژگانی شده\u200cاند: سفارتخانه، غسّالخانه، کتابخانه، گلخانه، میخانه، \
اساسنامه، بخشنامه، دانشنامه، سالنامه، شاهنامه، فصلنامه، قطعنامه، قولنامه، ماهنامه.\
"""
statement.en = """
خانه and نامه are productive enough that the standard calls them pseudo-suffixes. They \
take a half-space by default; the fourteen compounds it prints have lexicalised and are \
written solid.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
