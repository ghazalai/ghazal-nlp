[[rule]]
id = "academy.coordinative_compound"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ ترکیب\u200cهای عطفی و اتباعی"
title.en = "Echo and idiomatic coordinative compounds take a ZWNJ"
statement.fa = """
ترکیب\u200cهای اِتباعی با نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشوند: پول\u200cمول، \
پول\u200cوپله، دم\u200cودستگاه، دنگ\u200cوفنگ، شلوغ\u200cپلوغ. ترکیب\u200cهای عطفی در \
معنای مجازی یا اصطلاحی نیز: آب\u200cوهوا، پروبال، حیص\u200cوبیص، دوروبر، رتق\u200cوفتق، \
رفت\u200cوآمد، رفع\u200cورجوع، کم\u200cوکاست، هست\u200cونیست. تبصره: ترکیب\u200cهای \
عطفی\u200cای که در آن\u200cها واو عطف محذوف است با نیم\u200cفاصله نوشته می\u200cشوند: \
