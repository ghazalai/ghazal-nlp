# Orthography — the Academy's preferred spelling for words that have more than one.
#
#   دستور خطّ فارسی (ویراست جدید)
#   فرهنگستان زبان و ادب فارسی، نشر آثار، تهران، چاپ اول ۱۴۰۱
#   ISBN 978-622-5305-22-9
#   sha256 6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e
#
# The last quarter of the standard is not rules at all: it is two indexes of
# words that are written more than one way, with the Academy's preference marked
# for each. Pages 73–81 are common words, pages 82–85 proper names. This pack
# implements the first index and leaves the second.

[[rule]]
id = "orthography.preferred_spelling"
layer = "orthography"
title.fa = "املای مرجّح فرهنگستان برای واژه\u200cهای چنداملایی"
title.en = "The Academy's preferred spelling for a multi-spelling word"
statement.fa = """
برخی کلمات در فارسی دو یا چند صورت املایی دارند. فرهنگستان برای هریک صورت مرجّح را در \
«فهرست واژه\u200cهای عامّ دو یا چنداملایی» (صص ۷۳–۸۱) تعیین کرده است؛ ضوابط انتخاب، به \
ترتیب اولویت، عبارت\u200cاند از املای رایج\u200cتر، ملاحظات تاریخی و پرهیز از افزایش \
هم\u200cنگاشت\u200cها، و پرهیز از پیشنهاد صورت املایی غیرمتعارف.\
"""
statement.en = """
An index of about 130 Persian words with two or more current spellings, each with the \
one the Academy prefers — اتاق over اطاق, بلیت over بلیط, زغال over ذغال. Page 72 states \
the three criteria the choice follows.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "73–81"
source.locator = "«فهرست واژه\u200cهای عامّ دو یا چنداملایی»؛ ضوابط انتخاب در ص ۷۲"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "closed_list"
detector.file = "orthography-preferred-spellings.tsv"
detector.kind = "dispreferred_spelling"
detector.severity = "advisory"
detector.confidence = "high"
examples.ok = ["اتاق", "بلیت", "زغال", "طوفان", "آخر سال", "تراز مالی"]
examples.violations = [
  { text = "اطاق", expect = "اتاق" },
  { text = "بلیط", expect = "بلیت" },
  { text = "ذغال", expect = "زغال" },
]
severity = "advisory"
notes = """
Severity is advisory because the index is a *preference*, not a rule with an exception \
list: page 72 says these words have two or more current spellings and names the one the \
Academy chose. Nothing on the page calls the other form an error.\n\

Three classes of row are excluded from the shipped lexicon and the data file lists every \
one of them by name.\n\

Rows where the standard prints **both** forms as correct — توفان/طوفان، نعنا/نعناع، \
سرشک/سرشگ، دکمه/دگمه، سوگ/سوک، رتیل/رطیل، تبرزد/طبرزد، دایرةالمعارف/دائرةالمعارف، \
باتون/باتوم، بختنصر، پیشخوان — where there is nothing to correct.\n\

Rows the standard resolves **by sense**, where the rejected spelling is an ordinary word \
in another meaning: آخر/آخور، تاق/طاق، تراز/طراز، تاس/طاس، تایر/طایر، ختمی/خطمی، \
قرق/غرق، هیز/حیز، انتر/عنتر، آقا/آغا، ارک/ارگ. Flagging «آخر» as a misspelling of «آخور» \
would be the single worst false positive this rule base could produce; the excluded list \
is why it cannot.\n\

Rows whose preferred form contains a ZWNJ that the source PDF's text layer does not \
carry — الم\u200cشنگه، طاس\u200cکباب، ترق\u200cوتوروق، قاروقور، لق\u200cلق، وق\u200cوق، \
نق\u200cنق، قره\u200cقروت. A repair has to be exact, and we would be guessing.\n\

Matching is exact, so اطاق is caught and اطاق\u200cها is not. Extending to inflected \
forms means matching a listed form as a prefix of a longer token, and لق is on the \
Academy's list while لقمه is not a misspelling of it.\n\

One entry is worth naming because a reader will think it is a transcription error: \
**قدغن → غدغن**. It is not — page 78 prints غدغن in the preferred column, against the \
near-universal قدغن (7 to 2 in the corpus sample). The citation is there so the reader \
can look and disagree.\n\

Measured over a 1.08M-word sample of a 2026 Persian corpus: 431 findings, 346 of them \
اطاق, which is a Wikisource and books phenomenon rather than a Wikipedia one.\n\

The proper-name index on pages 82–85 (تهران/طهران، اتریش/اطریش، استانبول/اسلامبول) is \
deliberately not extracted here: it is a separate list with its own page range and its \
own hazards — many of its rows are historical variants that an old text is right to keep \
— and it deserves its own rule rather than being folded into this one.
"""
