# Orthography, from the Academy standard.
#
#   دستور خطّ فارسی (ویراست جدید)
#   فرهنگستان زبان و ادب فارسی، نشر آثار، تهران، چاپ اول ۱۴۰۱
#   ISBN 978-622-5305-22-9
#   retrieved 2026-08-04 from apll.ir/wp-content/uploads/2023/07/Dastour-e-Khat-17.04.1402.pdf
#   sha256 6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e
#
# ZWNJ (U+200C) is written \u200c.

[[rule]]
id = "academy.mi_prefix"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ «می» و «نمی»"
title.en = "The imperfective prefix takes a ZWNJ"
statement.fa = "«می» و «همی» (پیشوندهای فعل استمراری) نسبت به جزء اصلی فعل همواره با نیم\u200cفاصله نوشته می\u200cشوند."
statement.en = """
The imperfective prefixes می and همی are always written with a ZWNJ before the verb \
stem. The same holds for the negated form نمی.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 39
source.locator = "بند «می و همی»"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "verb_prefix"
detector.exceptions = "ghazal-mi-words.tsv"
examples.ok = ["می\u200cرود", "نمی\u200cنویسد", "کتاب را می\u200cخوانم", "میدان", "می ناب"]
examples.violations = [
  { text = "میرود", expect = "می\u200cرود" },
  { text = "می رود", expect = "می\u200cرود" },
  { text = "نمی گوید", expect = "نمی\u200cگوید" },
]
notes = "The verb analyser decides, so میدان and می (wine) are left alone; a verb it doesn't know isn't flagged."

[[rule]]
id = "academy.bi_prefix"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ پیشوند نفی «بی»"
title.en = "The privative prefix بی takes a ZWNJ"
statement.fa = """
«بی» در نقش پیشوند نفی همیشه با نیم\u200cفاصله از کلمهٔ پس از خود نوشته می\u200cشود، مگر \
در صورت\u200cهای واژگانی\u200cشده. «بی» در نقش حرف اضافه همیشه با فاصلهٔ کامل نوشته \
می\u200cشود.\
"""
statement.en = """
The privative prefix بی is always written with a ZWNJ before its host, except in a \
listed set of lexicalised forms. As a free preposition it takes a full space.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 39
source.locator = "بند «بی» و تبصرهٔ آن"
source.retrieved = "2026-08-04"
detector.type = "affix_zwnj"
detector.affix = "بی"
detector.position = "prefix"
detector.detect_space = true
detector.detect_solid = true
detector.free_form = true
detector.min_host = 3
detector.solid_exceptions = [
  "بیجا", "بیچاره", "بیخود", "بیداد", "بیدل", "بیراه", "بیزار", "بیعار", "بیکار", "بینوا",
  "بیهوش", "بیهوده", "بیگانه",
]
detector.lexical_exceptions = [
  "بیمار", "بیست", "بیرون", "بیان", "بیدار", "بیشه", "بینی", "بیضه", "بینش", "بیشتر",
  "بیمه", "بیضی", "بیابان", "بیعت", "بیت", "بینا", "بیوه", "بیل", "بیش", "بیگاه",
]
examples.ok = ["بی\u200cتردید", "بیچاره", "بیمار", "بیستم"]
examples.violations = [
  { text = "بی تردید", expect = "بی\u200cتردید" },
  { text = "بیحوصله", expect = "بی\u200cحوصله" },
]
notes = "بیهوده and بیگانه are listed because the book treats them as simple words. Medium confidence on spaces: the preposition بی (بی هیچ چشمداشتی) is right with a space."

[[rule]]
id = "academy.ham_prefix"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ پیشوند «هم»"
title.en = "The prefix هم takes a ZWNJ before its host"
statement.fa = """
«هم» در ترکیب همواره با نیم\u200cفاصله از کلمهٔ پس از خود نوشته می\u200cشود، مگر در \
فهرست استثناها. «هم» پیش از کلمهٔ پیش از خود همواره با فاصلهٔ کامل نوشته می\u200cشود.\
"""
statement.en = """
As a compounding prefix هم is written with a ZWNJ before its host, with a listed set of \
exceptions written solid. As a free adverb — با هم آمدند — it takes a full space.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 40
source.locator = "بند «هم» و پانوشت ۱"
source.retrieved = "2026-08-04"
detector.type = "affix_zwnj"
detector.affix = "هم"
detector.position = "prefix"
detector.detect_space = true
detector.detect_solid = false
detector.min_host = 3
detector.require_host_in = [
  "اتاق", "بازی", "پایه", "قدم", "گروه", "نسل", "نگاشت", "مخرج", "وطن", "کلاس", "خانه",
  "درس", "سفر", "تیم", "رزم", "سنگر", "دوره", "نام", "شکل", "جنس", "مرز", "نشین", "زمان",
  "پیمان", "رده", "سطح", "نوا",
]
detector.solid_exceptions = [
  "هماره", "همان", "هماورد", "هماهنگ", "همایش", "همباز", "همتا", "همچنان", "همچنین",
  "همچو", "همچون", "همدل", "همدم", "همدیگر", "همراه", "همزن", "همسان", "همسایه", "همسر",
  "همشهری", "همشیره", "همکار", "همکرد", "همکف", "همگن", "همگون", "همو", "هموار", "همواره",
  "هموند", "همیدون", "همین",
]
examples.ok = ["هم\u200cوطن", "همکار", "با هم آمدند"]
examples.violations = [
  { text = "هم وطن", expect = "هم\u200cوطن" },
  { text = "هم گروه", expect = "هم\u200cگروه" },
]
notes = "Fires only on hosts in its short compound list, since هم before a space is usually the adverb; the rest abstain. Solid forms aren't checked (همایون، همیشه). Both need فرهنگ املایی خطّ فارسی."

[[rule]]
id = "academy.comparative_tar"
layer = "orthography"
title.fa = "نیم\u200cفاصلهٔ «ـتر» و «ـترین»"
title.en = "The comparative and superlative suffixes take a ZWNJ"
statement.fa = """
«ـتر» و «ـترین» همواره با نیم\u200cفاصله/بی\u200cفاصله از کلمهٔ پیش از خود نوشته \
می\u200cشوند، مگر در: بهتر، کهتر، مهتر، بیشتر، کمتر، کلانتر.\
"""
statement.en = """
The comparative ـتر and superlative ـترین are always written with a ZWNJ after the word \
they attach to, except in six lexicalised forms.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 40
source.locator = "بند «ـتر و ـترین»"
source.retrieved = "2026-08-04"
detector.type = "affix_zwnj"
detector.affix = "تر"
detector.variants = ["ترین"]
detector.position = "suffix"
detector.detect_space = true
detector.detect_solid = true
detector.free_form = true
detector.min_host = 3
detector.solid_exceptions = ["بهتر", "کهتر", "مهتر", "بیشتر", "کمتر", "کلانتر"]
detector.solid_hosts = "comparative-hosts.tsv"
detector.lexical_exceptions = [
  "دختر", "دفتر", "بستر", "اختر", "کبوتر", "پوستر", "شتر", "چتر", "تئاتر", "مستر", "دکتر",
  "انتر", "اکثر", "معتبر", "منتظر", "دلاور",
]
examples.ok = ["بزرگ\u200cتر", "بهتر", "دختر", "زیبا\u200cترین", "کامپیوتر", "کیلومتر", "فیلتر"]
examples.violations = [
  { text = "بزرگ تر", expect = "بزرگ\u200cتر" },
  { text = "بزرگتر", expect = "بزرگ\u200cتر" },
  { text = "مهم ترین", expect = "مهم\u200cترین" },
]
severity = "advisory"
notes = "Advisory. A space (بزرگ تر) is wrong everywhere; solid (بزرگتر) is common and some publishers' house style, though the book rules it out. Medium confidence on spaces: تر is also 'wet'."

[[rule]]
id = "academy.plural_ha"
layer = "orthography"
title.fa = "جدانویسی «ـها»ی جمع"
title.en = "The plural marker ها is recommended to be written separately"
statement.fa = """
«ـها» (نشانهٔ جمع) به هر دو صورتِ پیوسته و جدا (با نیم\u200cفاصله) به کار می\u200cرود، \
ولی جدانویسی آن، از لحاظ آموزشی و همچنین مسائل فنی مربوط به پردازش متن، توصیه \
می\u200cشود.\
"""
statement.en = """
The plural ها is used both joined and separated, but the standard recommends separation \
— explicitly citing text processing as one of the reasons. A full space is not among the \
permitted forms.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 40
source.locator = "بند «ـها (نشانهٔ جمع)»"
source.retrieved = "2026-08-04"
detector.type = "affix_zwnj"
detector.affix = "ها"
detector.position = "suffix"
detector.detect_space = true
detector.detect_solid = true
detector.min_host = 3
detector.space_severity = "violation"
detector.solid_severity = "advisory"
detector.lexical_exceptions = [
  "تنها", "بها", "رها", "فقها", "گیاه", "سپاه", "دستگاه", "پناه",
]
examples.ok = ["کتاب\u200cها", "تنها", "خانه\u200cها"]
examples.violations = [
  { text = "کتاب ها", expect = "کتاب\u200cها" },
  { text = "کتابها", expect = "کتاب\u200cها" },
]
notes = "Joined ها is allowed, so that's advisory; a full space isn't, so that's a violation."

[[rule]]
id = "academy.plural_ha_after_silent_he"
layer = "orthography"
title.fa = "جدانویسی الزامی «ـها» پس از «ه»ی غیرملفوظ"
title.en = "The plural ها must be separated after a silent ه"
statement.fa = """
هرگاه کلمه به «ه»ی غیرملفوظ ختم شود، «ها» فقط به صورت جدا (با نیم\u200cفاصله) نوشته \
می\u200cشود: خانه\u200cها، میوه\u200cها.\
"""
statement.en = """
When the word ends in a silent ه, the plural ها may only be written separately. This is \
one of the six environments where the standard makes separation mandatory rather than \
recommended.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 41
source.locator = "تبصرهٔ «ها»، بند ۵"
source.retrieved = "2026-08-04"
detector.type = "pattern"
detector.pattern = "(?<![\\w\u200c])([\\w\u200c]*(?<!ا)ه)ها(?![\\w\u200c])"
detector.kind = "solid_where_zwnj_required"
detector.repair = "\\1\u200cها"
detector.severity = "violation"
detector.confidence = "high"
examples.ok = ["خانه\u200cها", "میوه\u200cها", "کتاب\u200cها"]
examples.violations = [
  { text = "خانهها", expect = "خانه\u200cها" },
  { text = "میوهها", expect = "میوه\u200cها" },
]
notes = "Also fires after a pronounced ه that follows a joining letter (فقیه\u200cها), which the book separates too."

[[rule]]
id = "academy.plural_ha_mandatory_separation"
layer = "orthography"
title.fa = "شش محیط جدانویسی الزامی «ـها»"
title.en = "The six environments where separating ها is mandatory"
statement.fa = """
«ها» در این موارد فقط به صورت جدا نوشته می\u200cشود: ۱) پس از کلمه\u200cهای بیگانه؛ ۲) \
هنگام برجسته\u200cسازی اصل کلمه؛ ۳) هرگاه کلمه پردندانه (بیش از سه دندانه) باشد؛ ۴) در \
جمع اسامی خاص؛ ۵) پس از «ه»ی غیرملفوظ یا «ه»ی ملفوظی که حرف پیش از آن متصل باشد؛ ۶) پس \
از یای ساکن.\
"""
statement.en = """
Six environments in which the plural ها may only be written separately. Environment 5 is \
implemented as academy.plural_ha_after_silent_he; the other five are recorded here \
and not yet checkable.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 41
source.locator = "تبصرهٔ «ها»، بندهای ۱ تا ۶"
source.retrieved = "2026-08-04"
examples.ok = ["ویتامین\u200cها", "سعدی\u200cها", "خط\u200cمشی\u200cها"]
examples.violations = [
  { text = "ویتامینها", expect = "ویتامین\u200cها" },
  { text = "سعدیها", expect = "سعدی\u200cها" },
]
notes = "No detector. Of the other five cases, two need a loanword list, one a list of names, one the writer's intent, and one a دندانه count (the only one doable from characters)."

[[rule]]
id = "academy.persian_letters"
layer = "orthography"
title.fa = "کاربرد «ی» و «ک» فارسی به\u200cجای «ي» و «ك» عربی"
title.en = "Persian ی and ک, not their Arabic counterparts"
statement.fa = """
نشانه\u200cهای اصلی خط فارسی «ی» و «ک» است؛ صورت\u200cهای عربی «ي» و «ك» جزو \
نشانه\u200cهای خط فارسی نیستند.\
"""
statement.en = """
The Persian letters ی (U+06CC) and ک (U+06A9) are the letters of the Persian script; the \
Arabic ي (U+064A) and ك (U+0643) are not.
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical", "colloquial"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 29
source.locator = "جدول ۱. نشانه\u200cهای خط فارسی (نشانه\u200cهای اصلی)"
source.retrieved = "2026-08-04"
detector.type = "pattern"
detector.pattern = "[يك]"
detector.kind = "arabic_letter_in_persian"
detector.translate = { "ي" = "ی", "ك" = "ک" }
detector.severity = "violation"
detector.confidence = "high"
detector.note = "Arabic yeh/kaf; write the Persian ی / ک"
examples.ok = ["کتاب\u200cهای ایرانی", "یکی"]
examples.violations = [
  { text = "كتاب" },
  { text = "ايران" },
]
notes = "No repair, since one pattern covers both letters. Any normalizer fixes this; the rule is here for the citation."

[[rule]]
id = "academy.ezafe_after_silent_he"
layer = "orthography"
title.fa = "کسرهٔ اضافه پس از «ه»ی غیرملفوظ"
title.en = "The ezāfe on a word ending in silent ه"
statement.fa = """
برای کلمه\u200cهای مختوم به «ه»ی غیرملفوظ، در حالت اضافه، از علامت «ۀ» استفاده \
می\u200cشود: خانۀ او، برنامۀ روزانه. این علامت کوتاه\u200cشدهٔ «ی» است و نباید آن را با \
نشانهٔ همزه اشتباه گرفت.\
"""
statement.en = """
The Academy requires the ezāfe on a word ending in silent ه to be written with the \
superscript sign (خانهٔ). Widespread contemporary usage instead writes ه + ZWNJ + ی \
(خانه\u200cی). The sources disagree; this rule reports the disagreement rather than \
settling it.
"""
kind = "contested"
status = "contested"
scope.registers = ["formal_written"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 47
source.locator = "بند «کسرهٔ اضافه» و پانوشت ۱"
source.retrieved = "2026-08-04"
detector.type = "pattern"
detector.pattern = "(?<![\\w\u200c])([\\w\u200c]*ه)\u200cی(?![\\w\u200c])"
detector.kind = "ezafe_form_disputed"
detector.repair = "\\1ٔ"
detector.severity = "advisory"
detector.confidence = "medium"
examples.ok = ["خانهٔ او", "برنامهٔ روزانه", "خانه\u200cها"]
examples.violations = [
  { text = "خانه\u200cی او", expect = "خانهٔ" },
  { text = "برنامه\u200cی روزانه", expect = "برنامهٔ" },
]
notes = "Contested: a finding shows both forms; it doesn't say the writer is wrong."

[[rule.disputes]]
source = "contemporary editorial practice"
summary = "Much modern publishing and most web text writes خانه\u200cی. It's clear and survives copy-paste between systems that mangle U+0654."
