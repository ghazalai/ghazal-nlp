notes = "Contested: the book joins these (پیش\u200cاز، ازنظر), published Persian almost always spaces them, so it fires on a lot of ordinary prose. Advisory, medium confidence."

[[rule.disputes]]
source = "contemporary editorial practice, measured over a 2026 Persian corpus"
summary = "Published Persian spaces these: in a 1.08M-word sample پیش از runs 340 spaced to 1 joined, بعد از 682 to 8, راجع به 180 to 1, از نظر 150 to 6. Only به طور follows the book (164 joined to 47 spaced)."

[[rule]]
id = "academy.numeral_spacing"
layer = "orthography"
title.fa = "قواعد عددنویسی"
title.en = "How the parts of a written-out number are spaced"
statement.fa = """
اعداد بدون واو با نیم\u200cفاصله/بی\u200cفاصله نوشته می\u200cشوند (یکصد، چهارصد، دوهزار، \
یک\u200cمیلیون؛ استثنا: نهصد)؛ اعداد واودار با فاصلهٔ کامل (بیست و یک، هزار و دویست و \
شصت و سه)؛ اعداد ترتیبی با فاصلهٔ کامل (بیست و سوم، سی و یکمین)؛ اعداد کسری با \
نیم\u200cفاصله/بی\u200cفاصله (یک\u200cچهارم، دوپنجم)؛ و واژه\u200cهای مرکبی که در \
آن\u200cها عدد به کار رفته با نیم\u200cفاصله/بی\u200cفاصله (۴۷سالگی، پنج\u200cلایه، \
ده\u200cچرخ)، مگر آن\u200cها که بسیط\u200cگونه شده\u200cاند (پنجشنبه، یکتا، یکدیگر، \
یکشنبه، یکهو).\
"""
statement.en = """
Five separate spacing rules for numbers written as words: no-vāv numbers join, \
vāv-bearing numbers and ordinals take full spaces, fractions join, and numeral compounds \
join except for a listed set that has lexicalised.
"""
kind = "prescriptive"
status = "proposed"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = "65–66"
source.locator = "«ترکیب\u200cها»، بند ۱۰ الف و ب"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
examples.ok = ["بیست و یک", "چهارصد", "یک\u200cچهارم", "پنجشنبه", "سی\u200cسالگی"]
examples.violations = [
  { text = "بیستویک", expect = "بیست و یک" },
  { text = "دو هزار", expect = "دوهزار" },
  { text = "یک چهارم", expect = "یک\u200cچهارم" },
]
notes = "No detector: «دو هزار» is دوهزار as the number 2000 but two words in «دو هزار تومانی». The book says nothing about digit characters."
