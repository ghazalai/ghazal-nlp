[[rule]]
id = "academy.compound_conjunction"
layer = "orthography"
title.fa = "فاصله\u200cگذاری حروف ربط مرکب"
title.en = "Compound conjunctions are written without a full space"
statement.fa = """
فاصلهٔ میان اجزای حروف ربط مرکب — چه آن\u200cها که با «که» ساخته شده\u200cاند و چه بی \
«که» — نیم\u200cفاصله/بی\u200cفاصله است: ازآنجاکه، بااینکه، درحالی\u200cکه، \
درصورتی\u200cکه، بنابراین، ازاین\u200cرو، وگرنه. استثنا: بلکه. اگر جزء پیش\u200cاز «که» \
مجموعهٔ باز باشد (به\u200cطوری که، به\u200cنحوی که) فاصلهٔ کامل گذاشته می\u200cشود، و \
حروف ربط بیش از سه جزء نیز با فاصلهٔ کامل نوشته می\u200cشوند.\
"""
statement.en = """
The parts of a compound conjunction are held together by a ZWNJ, or by nothing where the \
preceding letter does not join. The standard prints both lists — the ones built with که \
and the ones without — and exempts open sets (به\u200cطوری که) and conjunctions of more \
than three parts (به هر دلیل که).
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
