[[rule]]
id = "academy.demonstrative_compounds"
layer = "orthography"
title.fa = "فاصله\u200cگذاری «این» و «آن» در ترکیب"
title.en = "The demonstratives این and آن in fixed compounds"
statement.fa = """
«این» و «آن» با فاصلهٔ کامل از کلمهٔ پس\u200cاز خود نوشته می\u200cشوند؛ ولی در حروف ربط \
مرکب میان آن\u200cها و کلمهٔ پس\u200cاز آن\u200cها نیم\u200cفاصله گذاشته می\u200cشود \
(آن\u200cطور، این\u200cطور، آن\u200cگونه، این\u200cگونه). استثنا: آنجا، آنچه، آنکه، \
اینجا، اینکه، وانگهی که پیوسته نوشته می\u200cشوند.\
"""
statement.en = """
این and آن take a full space before an ordinary noun (این کتاب), a ZWNJ in the compound \
conjunctions (این\u200cطور، آن\u200cگونه), and no separator at all in the six listed \
exceptions (آنجا، آنچه، آنکه، اینجا، اینکه، وانگهی).
"""
kind = "prescriptive"
status = "active"
scope.registers = ["formal_written", "technical"]
source.work = "دستور خطّ فارسی (ویراست جدید)"
source.publisher = "فرهنگستان زبان و ادب فارسی"
source.edition = "چاپ اول ۱۴۰۱"
source.isbn = "978-622-5305-22-9"
source.page = 34
source.locator = "بند «این، آن» و تبصره\u200cهای ۱ و ۲"
source.retrieved = "2026-08-04"
source.sha256 = "6071a6fe7572dfb6b8211033bba82436d59bbe8ec3c1f81312de6b76ef90603e"
detector.type = "closed_list"
detector.kind = "space_where_joined"
detector.entries."این طور" = "این\u200cطور"
detector.entries."آن طور" = "آن\u200cطور"
detector.entries."این گونه" = "این\u200cگونه"
detector.entries."آن گونه" = "آن\u200cگونه"
detector.entries."این جا" = "اینجا"
detector.entries."آن جا" = "آنجا"
detector.entries."آن چه" = "آنچه"
detector.abstain_on = ["این که", "آن که"]
detector.abstain_reason = "repair depends on sense — p. 34, تبصرهٔ ۲"
examples.ok = ["آنجا", "این کتاب", "این\u200cگونه", "این چه کاری است"]
examples.violations = [
  { text = "این طور", expect = "این\u200cطور" },
  { text = "آن جا", expect = "آنجا" },
  { text = "آن چه", expect = "آنچه" },
]
notes = "این چه isn't listed (only آنچه is), so «این چه کاری است» passes. این که and آن که abstain: the book joins them or uses a ZWNJ depending on sense."

[[rule]]
id = "academy.har_lexicalised"
layer = "orthography"
title.fa = "ترکیب\u200cهای واژگانی\u200cشدهٔ «هر»"
title.en = "The lexicalised compounds of هر are written solid"
statement.fa = """
«هر» همواره با فاصلهٔ کامل از کلمهٔ پس\u200cاز خود نوشته می\u200cشود، مگر در مواردی که \
با آن واژگانی شده باشد که در این صورت بی\u200cفاصله نوشته می\u200cشود: هرآینه، هرازگاهی، \
هرچند، هرطور، هرکدام، هرکس، هرکه، هرگاه، هرگونه، هریک.\
"""
statement.en = """
